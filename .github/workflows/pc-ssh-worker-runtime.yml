name: Local workerd SSH dependency fixture
on:
  push:
    branches: [chatgpt/cloudflare-control-20261123]
    paths:
      - '.github/workflows/pc-ssh-worker-runtime.yml'
      - 'projects/cloudflare-control/fixtures/ssh-worker-runtime/**'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WRANGLER_SEND_METRICS: "false"
    defaults:
      run:
        working-directory: projects/cloudflare-control/fixtures/ssh-worker-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Bundle only no deploy
        run: npx --no-install wrangler deploy --dry-run --outdir dist
      - name: Execute local workerd synthetic fixture
        run: node run.mjs
