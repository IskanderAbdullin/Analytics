permissions:
  contents: read

jobs:
  check-source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate known spent seeds and no source constant drift
        run: |
          python -m unittest discover -s tests_research -p 'test_*.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_binphase_sensitivity.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_phase_review.py' -v
          python -m unittest discover -s tests_background -p 'test_binance_public_trade_archive.py' -v
          python -m unittest discover -s tests_background -p 'test_public_trade_direction_null.py' -v
          python -m unittest discover -s tests_background -p 'test_real_public_trade_pair_review.py' -v
          python -m unittest discover -s tests_background -p 'test_real_spot_transfer_review.py' -v
          python -m unittest discover -s tests_background -p 'test_real_spot_occupancy_review.py' -v
          python -m unittest discover -s tests_background -p 'test_real_bch_four_day_panel_review.py' -v
          python -m unittest discover -s tests_background -p 'test_lobster_public_sample_format_audit.py' -v
          python -m unittest discover -s tests_background -p 'test_lobster_event_time_features.py' -v
          python -m unittest discover -s tests_background -p 'test_l2_duration_weighting.py' -v
          python -m unittest discover -s tests_background -p 'test_public_l2_ownership_nonidentifiability.py' -v
          python -m unittest discover -s tests_background -p 'test_public_l2_feed_coverage_gate.py' -v
          python -m unittest discover -s tests_background -p 'test_offline_research_reproducer.py' -v
          python -m unittest discover -s tests_background -p 'test_toy_public_execution_rhythm.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_fixed_clock_transfer.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_multiscale_public_l2.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_background_ratio_holdout.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_split_half_momentum_holdout.py' -v
          python -m unittest discover -s tests_background -p 'test_public_timing_phase_tied_fills.py' -v
          python -m unittest discover -s tests_background -p 'test_public_cluster_conditional_toy_null.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_clustered_grid_holdout.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_matched_smalln_audit.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_grid_replication_160.py' -v
          python -m unittest discover -s tests_background -p 'test_public_time_precision_coverage_null.py' -v
          python -m unittest discover -s tests_background -p 'test_public_interarrival_period_scan_negative.py' -v
          python tools/public_interarrival_period_scan_negative.py --output data/results/public-interarrival-frozen-negative.json
          python tools/public_time_precision_coverage_null.py --output data/results/public-precision-coverage-52views.json
          python -m unittest discover -s tests_background -p 'test_abides_160_original_audit.py' -v
          python tools/abides_160_original_audit.py
          python tools/abides_matched_smalln_audit.py --output data/results/abides-matched-uncertainty.json
          python tools/public_cluster_conditional_toy_null.py --output data/results/public-cluster-conditional-toy-null.json
          python tools/public_timing_phase_tied_fills.py --output data/results/public-phase-tied-fill-diagnostic.json
          python -m unittest discover -s tests_background -p 'test_public_clock_aliasing_negative.py' -v
          python tools/public_clock_aliasing_negative.py
          python tools/toy_public_execution_rhythm.py --output data/results/heldout-public-rhythm-hard-negative.json
          python tools/offline_research_reproducer.py --output data/results/reproduction-offline-source-free.json
          python tools/public_l2_feed_coverage_gate.py
          python tools/public_l2_ownership_nonidentifiability.py
          python -m unittest discover -s tests_background -p 'test_autonomy_checkpoint.py' -v
          python -m unittest discover -s tests_background -p 'test_master_research_plan.py' -v
          python tools/autonomy_checkpoint.py
          python tools/real_public_trade_pair_review.py --output data/results/two-days-source-provenance.json
          python -m unittest discover -s tests_background -p 'test_public_tape_fingerprint.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_phase_fragility.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_twap_phase_contrast.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_twap_separability.py' -v
          python tools/research_seed_registry.py
          python - <<'PY'
          from tools.research_seed_registry import read_ledger, audit_sources, assess_proposed_seeds
          ledger=read_ledger()
          audit=audit_sources(ledger)
          assert audit['source_constant_checks'] and not audit['globally_unused_seeds_verified'],audit
          spent=assess_proposed_seeds(ledger,[1801,1901])
          assert len(spent['known_spent_overlap'])==2,spent
          assert spent['eligible_for_claim_of_fresh_blind_test'] is False,spent
          candidate=assess_proposed_seeds(ledger,[2201,2202])
          assert candidate['not_previously_listed_in_project_ledger'] is True,candidate
          assert candidate['globally_unused_or_unseen_elsewhere_verified'] is False,candidate
          print('SEED_LEDGER_GUARD_VALIDATED',
                {'canonical_spent_seeds':audit['canonical_spent_seeds'],
                 'frozen_source_checks':len(audit['source_constant_checks'])})
          PY
          # Cheap source-free current-stage tests (not ABIDES simulations).
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_conditional_timing_null.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_burst_null_falsification.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_intensity_conditioned_null.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_period_scan.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_period_l2_gate.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_abc_constructed_controls.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_abc_report.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_intensity_equivalence_class.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_period_l2_ambiguity.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_intensity_quality_guard.py' -v
          PYTHONPATH=tools python -m unittest discover -s tests_background -p 'test_public_microburst_block_null.py' -v
          PYTHONPATH=tools python tools/public_abc_report.py --output data/results/abc-constructed-source-free.json
      - name: Upload bounded constructed A/B/C aggregate only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: robot-detector-abc-constructed-${{ github.run_id }}
          path: projects/robot-detector/data/results/abc-constructed-source-free.json
          retention-days: 3
          if-no-files-found: error
