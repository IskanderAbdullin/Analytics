permissions:
  contents: read

jobs:
  check-source-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate known spent seeds and no source constant drift
        run: |
          python -m unittest discover -s tests_research -p 'test_*.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_binphase_sensitivity.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_phase_review.py' -v
          python -m unittest discover -s tests_background -p 'test_binance_public_trade_archive.py' -v
          python -m unittest discover -s tests_background -p 'test_public_trade_direction_null.py' -v
          python -m unittest discover -s tests_background -p 'test_real_public_trade_pair_review.py' -v
          python -m unittest discover -s tests_background -p 'test_real_spot_transfer_review.py' -v
          python -m unittest discover -s tests_background -p 'test_real_spot_occupancy_review.py' -v
          python -m unittest discover -s tests_background -p 'test_real_bch_four_day_panel_review.py' -v
          python -m unittest discover -s tests_background -p 'test_lobster_public_sample_format_audit.py' -v
          python -m unittest discover -s tests_background -p 'test_autonomy_checkpoint.py' -v
          python tools/autonomy_checkpoint.py
          python tools/real_public_trade_pair_review.py --output data/results/two-days-source-provenance.json
          python -m unittest discover -s tests_background -p 'test_public_tape_fingerprint.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_phase_fragility.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_twap_phase_contrast.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_l2_twap_separability.py' -v
          python tools/research_seed_registry.py
          python - <<'PY'
          from tools.research_seed_registry import read_ledger, audit_sources, assess_proposed_seeds
          ledger=read_ledger()
          audit=audit_sources(ledger)
          assert audit['source_constant_checks'] and not audit['globally_unused_seeds_verified'],audit
          spent=assess_proposed_seeds(ledger,[1801,1901])
          assert len(spent['known_spent_overlap'])==2,spent
          assert spent['eligible_for_claim_of_fresh_blind_test'] is False,spent
          candidate=assess_proposed_seeds(ledger,[2201,2202])
          assert candidate['not_previously_listed_in_project_ledger'] is True,candidate
          assert candidate['globally_unused_or_unseen_elsewhere_verified'] is False,candidate
          print('SEED_LEDGER_GUARD_VALIDATED',
                {'canonical_spent_seeds':audit['canonical_spent_seeds'],
                 'frozen_source_checks':len(audit['source_constant_checks'])})
          PY
