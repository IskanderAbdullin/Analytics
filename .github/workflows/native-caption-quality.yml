name: Native caption archive quality integration checks
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/native-caption-quality/**','.github/workflows/native-caption-quality.yml']
permissions:
  contents: read
  statuses: write
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check private archive metrics and known timestamp anchors
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/native-caption-quality/check.py | tee "$RUNNER_TEMP/quality.log"
      - name: Report results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -c '^QUALITY ' "$RUNNER_TEMP/quality.log" || true)
          state=failure
          if [ "$count" = "3" ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=native-caption-quality -f description="Quality metrics for $count archives" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
