name: YouTube archive isolated Worker creation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-archive-worker-create.yml'
      - 'projects/youtube-archive-worker/**'
permissions:
  contents: read
concurrency:
  group: youtube-archive-worker-create
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Offline mock tests
        run: node --test projects/youtube-archive-worker/worker.test.mjs
      - name: Create isolated Worker and verify public-safe smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 projects/youtube-archive-worker/deploy.py
