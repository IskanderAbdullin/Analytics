name: YouTube archive OAuth live diagnosis
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/youtube-archive-worker-create.yml'
      - 'projects/youtube-archive-worker/probe-oauth.mjs'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node projects/youtube-archive-worker/probe-oauth.mjs
