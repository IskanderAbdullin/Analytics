name: Robot Detector public T-Invest archive smoke

on:
  pull_request:
    paths:
      - 'projects/robot-detector/docs/PUBLIC_ARCHIVE_VALIDATION.md'
      - '.github/workflows/robot-detector-public-history.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one-public-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Attempt read-only public CSV archive, no credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw data/results
          echo "One public read-only archive, 2026-11-17, SBER_TQBR; no token or order API"
          set +e
          timeout 180 dotnet run --project src/RobotDetector.Cli -c Release -- \
            fetch --date 2026-11-17 --instrument-id SBER_TQBR \
            --output data/raw/public_sber_2026-11-17.csv > /tmp/robot-fetch.log 2>&1
          rc=$?
          set -e
          if [[ $rc -ne 0 ]] && grep -q "Received ZIP; choose a .zip output path" /tmp/robot-fetch.log; then
            set +e
            timeout 180 dotnet run --project src/RobotDetector.Cli -c Release -- \
              fetch --date 2026-11-17 --instrument-id SBER_TQBR \
              --output data/raw/public_sber_2026-11-17.zip > /tmp/robot-fetch.log 2>&1
            rc=$?
            set -e
          fi
          if [[ $rc -ne 0 ]]; then
            echo "BLOCKED_BY_DATA: public archive did not download or format mismatched"
            sed -n '1,12p' /tmp/robot-fetch.log
            echo "TLS_DIAGNOSTICS (public host, no credentials):"
            timeout 20 curl -vIsS --connect-timeout 8 --max-time 15 https://invest-public-api.tbank.ru 2>&1 | tail -n 24 || true
            exit 0
          fi
          echo "ARCHIVE_DOWNLOADED"
          if [[ -f data/raw/public_sber_2026-11-17.csv ]]; then
            input=data/raw/public_sber_2026-11-17.csv
          else
            input=data/raw/public_sber_2026-11-17.zip
          fi
          set +e
          timeout 180 dotnet run --project src/RobotDetector.Cli -c Release -- \
            detect --input "$input" --max-rows 1000000 \
            --max-group-events 5000 --window-minutes 60 \
            --output data/results/public-smoke.json > /tmp/robot-detect.log 2>&1
          result=$?
          set -e
          if [[ $result -ne 0 && $result -ne 3 ]]; then
            echo "BLOCKED_BY_DATA_OR_COVERAGE: unable to parse or screen this day"
            sed -n '1,12p' /tmp/robot-detect.log
            exit 0
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("data/results/public-smoke.json").read_text())
          print("REAL_PUBLIC_DATA_PARSED", {
              "sourceTradeCount":p["sourceTradeCount"],
              "rejectedRowCount":p["rejectedRowCount"],
              "candidatePatternCount":p["candidatePatternCount"],
              "coverageVerified":p["coverageVerified"],
              "physicalBotCountKnown":p["physicalBotCountKnown"],
              "sourceSha256":p["sourceSha256"]
          })
          for w in p["warnings"]:
              if w.startswith("SKIPPED_DENSE_GROUP"): print(w[:170])
          assert not p["physicalBotCountKnown"]
          assert all(pattern["state"]=="candidate" for pattern in p["patterns"])
          PY
          echo "No actual trade prints or broker secrets are uploaded as artifacts."
      - name: Remove raw temporary exchange data
        if: always()
        shell: bash
        run: rm -rf data/raw data/results
