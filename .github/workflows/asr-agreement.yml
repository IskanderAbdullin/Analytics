name: Bounded ASR agreement benchmark
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/asr-agreement/**','.github/workflows/asr-agreement.yml']
permissions:
  contents: read
  statuses: write
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install faster-whisper imageio-ffmpeg numpy
      - name: Compare three one-minute samples with existing native captions
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/asr-agreement/compare.py | tee "$RUNNER_TEMP/agreement.log"
      - name: Report benchmark status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -c '"status": "compared"' "$RUNNER_TEMP/agreement.log" || true)
          state=failure
          if [ "$count" = "3" ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=asr-agreement -f description="Compared $count/3 samples" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
