name: Source-neutral corpus reader integration test
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/corpus-reader/**','.github/workflows/corpus-reader.yml']
permissions:
  contents: read
  statuses: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic unit tests
        working-directory: projects/corpus-reader
        run: python -m unittest -v
      - name: Verify four private archive entries without outputting source text
        working-directory: projects/corpus-reader
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python corpus_reader.py manifest.jsonl
      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=corpus-reader -f description="Unit tests and 4 private receipts passed" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
