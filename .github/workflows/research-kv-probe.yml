name: Private KV research storage probe
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/research-kv-probe/**', '.github/workflows/research-kv-probe.yml']
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dedicated private namespace with synthetic data
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/research-kv-probe/kv_probe.py | tee "$RUNNER_TEMP/kv.log"
      - name: Publish result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          description=$(grep 'KV_RESULT read' "$RUNNER_TEMP/kv.log" | tail -1 | cut -c1-130 || true)
          state=failure
          if grep -q 'KV_RESULT read 200 sha256_match True' "$RUNNER_TEMP/kv.log"; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=research-kv-probe -f description="${description:-KV not verified}" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
