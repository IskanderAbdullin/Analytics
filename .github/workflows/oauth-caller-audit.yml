name: OAuth caller private Serverspace preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oauth-caller-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare private Cloudflare API client
        run: |
          gzip -dc projects/cloudflare-control/serverspace_deploy.py.gz > "$RUNNER_TEMP/serverspace_deploy.py"
          python -m py_compile "$RUNNER_TEMP/serverspace_deploy.py" projects/cloudflare-control/caller_audit.py
      - name: Inspect live OAuth Worker without logging code or secret values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONPATH: ${{ runner.temp }}
        run: python -u projects/cloudflare-control/caller_audit.py
