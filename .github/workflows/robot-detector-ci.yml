name: Robot Detector .NET CI

on:
  push:
    paths:
      - 'projects/robot-detector/**'
      - '.github/workflows/robot-detector-ci.yml'
  pull_request:
    paths:
      - 'projects/robot-detector/**'
      - '.github/workflows/robot-detector-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core, CLI, and tests
        run: |
          dotnet build src/RobotDetector.Core/RobotDetector.Core.csproj -c Release --nologo
          dotnet build src/RobotDetector.Cli/RobotDetector.Cli.csproj -c Release --nologo
          dotnet build src/RobotDetector.Server/RobotDetector.Server.csproj -c Release --nologo
          dotnet build tests/RobotDetector.SelfTests/RobotDetector.SelfTests.csproj -c Release --nologo
      - name: Deterministic offline self-tests
        run: dotnet run --project tests/RobotDetector.SelfTests -c Release --no-build
      - name: CLI fixture smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- detect \
            --input fixtures/synthetic_twap_5s.csv --output /tmp/robot-detector-report.json
          python3 - <<'PY'
          import json
          p = json.load(open("/tmp/robot-detector-report.json", encoding="utf-8"))
          assert p["candidatePatternCount"] == 1, p
          q = p["patterns"][0]
          assert q["periodMilliseconds"] == 5000, q
          assert q["matchedCount"] == 6 and q["missedCycles"] == 1, q
          assert q["confidenceCalibrated"] is None, q
          assert p["physicalBotCountKnown"] is False, p
          PY
      - name: Conservative multi-window fusion smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- fusion \
            --input fixtures/synthetic_cross_hour_5s.csv \
            --output /tmp/robot-fusion.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-fusion.json",encoding="utf-8"))
          assert r["candidateEpisodeCount"] == 2, r
          assert r["conservativelyLinkedGroupCount"] == 1, r
          assert r["linkedEpisodeCount"] == 1, r
          assert r["uniqueAttributedPrintCount"] == 13, r
          assert r["uniqueAttributedLots"] == 1300, r
          assert r["actualBotCountKnown"] is False, r
          assert r["groups"][0]["confidenceCalibrated"] is None, r
          PY
      - name: Chronological multi-cutoff forecast smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- rolling-forecast \
            --input fixtures/synthetic_long_cadence_5min.csv \
            --min-matches 4 --warmup-minutes 20 --stride-minutes 10 \
            --max-cutoffs 4 --output /tmp/robot-rolling.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-rolling.json",encoding="utf-8"))
          assert r["cutoffsExamined"] == 4, r
          assert r["forecastsEvaluated"] >= 1, r
          assert r["observedHits"] >= 1, r
          assert r["placeboHits"] == 0, r
          assert r["actualBotCountKnown"] is False, r
          assert r["calibrated"] is False, r
          PY
      - name: Forecast failure diagnostic smoke (synthetic)
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- diagnose-forecast \
            --input fixtures/synthetic_long_cadence_5min.csv \
            --min-matches 4 --warmup-minutes 20 --stride-minutes 10 \
            --max-cutoffs 4 --output /tmp/robot-diagnostic.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-diagnostic.json",encoding="utf-8"))
          assert r["forecastsEvaluated"] == 4, r
          assert r["exactHits"] == 4, r
          assert r["misses"] == 0, r
          assert sum(x["evaluatedForecasts"] for x in r["historicalAgeBuckets"]) == 4, r
          assert r["actualBotCountKnown"] is False, r
          assert r["statisticalSignificanceEstablished"] is False, r
          PY
      - name: Recency-gated next-print forecast smoke (no future leakage)
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- rolling-forecast \
            --input fixtures/synthetic_long_cadence_5min.csv \
            --min-matches 4 --warmup-minutes 20 --stride-minutes 10 \
            --max-cutoffs 4 --max-training-age-cycles 2 \
            --output /tmp/robot-fresh.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-fresh.json",encoding="utf-8"))
          assert r["maximumTrainingAgeCycles"] == 2, r
          assert r["forecastsEvaluated"] == 4, r
          assert r["observedHits"] == 4, r
          assert r["placeboHits"] == 0, r
          assert r["calibrated"] is False, r
          assert r["actualBotCountKnown"] is False, r
          PY
      - name: Experimental variable-clip cadence and temporal controls smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- variable-cadence \
            --input fixtures/synthetic_variable_clip_5s.csv \
            --output /tmp/robot-variable.json
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- variable-temporal-null \
            --input fixtures/synthetic_variable_clip_5s.csv \
            --mode uniform --trials 3 --output /tmp/robot-variable-null.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-variable.json",encoding="utf-8"))
          assert r["candidateSequenceCount"] == 1, r
          assert r["candidates"][0]["periodMs"] == 5000, r
          assert r["candidates"][0]["distinctQuantities"] == 4, r
          assert r["candidates"][0]["matchedPrints"] == 12, r
          assert r["physicalBotCountKnown"] is False, r
          assert r["statisticalSignificanceEstablished"] is False, r
          n=json.load(open("/tmp/robot-variable-null.json",encoding="utf-8"))
          assert n["trialsRun"] == 3 and n["originalCandidateSequences"] == 1, n
          assert n["actualBotCountKnown"] is False and n["significanceCalibrated"] is False, n
          PY
      - name: Simple descriptive flow-footprint smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- flow-footprint \
            --input fixtures/synthetic_variable_clip_5s.csv --window-minutes 5 \
            --bin-seconds 1 --output /tmp/flow-footprint.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/flow-footprint.json",encoding="utf-8"))
          assert r["inputPrints"] == 12, r
          assert r["windowCount"] == 1, r
          w=r["windows"][0]
          assert w["publicPrintCount"] == 12, w
          assert w["totalLots"] == 300 and w["sellReportedLots"] == 300, w
          assert w["buyReportedLots"] == 0 and w["unknownDirectionLots"] == 0, w
          assert w["longestSellReportedRun"] == 12, w
          assert w["medianInterarrivalMs"] == 5000, w
          assert w["nearWholeSecondPrints"] == 12, w
          assert not r["actualBotCountKnown"] and not r["statisticalSignificanceEstablished"], r
          PY
      - name: Public-only previous-bin volume response and source isolation smoke
        run: |
          python3 - <<'PY'
          import csv,datetime
          from pathlib import Path
          base=datetime.datetime(2026,11,19,7,0,tzinfo=datetime.timezone.utc)
          fields=['TRADE_TS','INSTRUMENT_UID','DIRECTION','PRICE','QUANTITY',
                  'TRADE_SOURCE','EVENT_ID','TICKER','TRADING_MODE','SESSION_ID','DATA_KIND']
          with Path('/tmp/volume-response-dev.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=fields)
              w.writeheader()
              for i in range(12):
                  ts=(base+datetime.timedelta(seconds=30*i)).isoformat().replace('+00:00','Z')
                  for side,quantity in [('BUY',40*i),('SELL',(i+1)*100-40*i)]:
                      if quantity<=0: continue
                      w.writerow(dict(TRADE_TS=ts,INSTRUMENT_UID='VOLUME-DEV',
                         DIRECTION=side,PRICE='100.00',QUANTITY=quantity,
                         TRADE_SOURCE='EXCHANGE',EVENT_ID=f'{side}-{i}',
                         TICKER='DEV',TRADING_MODE='SIM',SESSION_ID='DEV-S1',
                         DATA_KIND='SYNTHETIC'))
          PY
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- volume-response \
            --input /tmp/volume-response-dev.csv --bin-seconds 30 --min-pairs 8 \
            --output /tmp/volume-response-dev.json
          python3 - <<'PY'
          import json, math
          r=json.load(open('/tmp/volume-response-dev.json',encoding='utf-8'))
          assert r['inputPublicPrints']==23 and len(r['sideProfiles'])==2, r
          assert len(r['observations'])==11, r
          assert not r['physicalBotCountKnown'] and not r['statisticalSignificanceEstablished'], r
          buy=next(p for p in r['sideProfiles'] if p['reportedDirection']=='BUY')
          assert buy['publicPrintsForSide']==11 and buy['observedLotsForSide']==2640, buy
          assert buy['eligibleAdjacentPairs']==11 and buy['unobservedClockTransitions']==0, buy
          assert math.isclose(buy['spearmanPreviousMarketLotsToCurrentSideLots'],1.0), buy
          assert math.isclose(buy['medianCurrentSideLotsOverPreviousMarketLots'],0.4), buy
          assert not buy['ownerIdentityKnown'] and not buy['significanceCalibrated'], buy
          assert all(o['previousTotalMarketLots']>0 and 'agent' not in str(o).lower() for o in r['observations']), r
          print('VOLUME_RESPONSE_DEV_PUBLIC_ONLY',json.dumps({
              'groups':r['evaluatedSourceGroups'],'observations':len(r['observations']),
              'rho':buy['spearmanPreviousMarketLotsToCurrentSideLots'],
              'calibrated':r['statisticalSignificanceEstablished']
          }))
          PY
      - name: Simple history-only activity burst smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- activity-episodes \
            --input fixtures/synthetic_activity_episode.csv \
            --output /tmp/robot-activity.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-activity.json",encoding="utf-8"))
          assert r["inputPrints"] == 40, r
          assert r["inputPopulatedWindows"] == 5, r
          assert r["evaluatedWindows"] == 1, r
          assert r["activityWindowCount"] == 1, r
          a=r["activityWindows"][0]
          assert a["publicPrintCount"] == 20 and a["totalLots"] == 2000, a
          assert a["baselineMedianPrintCount"] == 5, a
          assert a["baselineMedianLots"] == 50, a
          assert a["printCountRatio"] == 4 and a["totalLotsRatio"] == 40, a
          assert a["state"] == "unvalidated_observed_activity", a
          assert not a["actorIdentityKnown"], a
          assert not r["actualBotCountKnown"] and not r["significanceCalibrated"], r
          PY
      - name: Market-wide clock phase and minute-rotation null smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- clock-phase-audit \
            --input fixtures/synthetic_long_cadence_5min.csv \
            --min-prints 8 --trials 19 --seed 19 \
            --output /tmp/robot-market-clock.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-market-clock.json",encoding="utf-8"))
          assert r["inputPrints"]==13, r
          assert r["sourceGroups"]==1 and r["eligibleSourceGroups"]==1, r
          assert r["ownerCountKnown"] is False and r["statisticalSignificanceEstablished"] is False, r
          g=r["groups"][0]
          assert g["printsInFirstMilliseconds"]==13, g
          assert g["observedFirstPhaseShare"]==1, g
          assert g["phaseHistogram100Ms"]==[13,0,0,0,0,0,0,0,0,0], g
          assert len(g["rotatedControlCounts"])==19, g
          assert g["nullMeanFirstPhaseShare"]<0.6, g
          assert g["maximumBinControl"]["peak100MsBin"]==0, g
          assert g["maximumBinControl"]["observedPeakBinCount"]==13, g
          assert len(g["maximumBinControl"]["rotatedMaximumBinCounts"])==19, g
          assert g["maximumBinControl"]["descriptiveAnyBinTailFrequency"] >= g["descriptiveGlobalTailFrequency"], g
          PY
      - name: No-dedup timestamp precision smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- timestamp-quality \
            --input fixtures/synthetic_twap_5s.csv \
            --output /tmp/timestamp-quality.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/timestamp-quality.json",encoding="utf-8"))
          assert r["sourcePrints"]==7 and r["sourceGroups"]==1, r
          assert not r["ownerCountKnown"], r
          assert not r["sourceTimestampPrecisionVerified"], r
          assert not r["feedCoverageVerified"], r
          g=r["groups"][0]
          assert g["publicPrintCount"]==7, g
          assert g["uniqueTimestampCount"]==7, g
          assert g["sameTimestampClusters"]==0, g
          assert g["printsInSameTimestampClusters"]==0, g
          assert g["maxPrintsAtSameTimestamp"]==1, g
          PY
      - name: Raw-vs-derived observable print-cluster cadence smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- cluster-compare \
            --input fixtures/synthetic_split_clips_5s.csv \
            --min-matches 6 --output /tmp/print-cluster-comparison.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/print-cluster-comparison.json",encoding="utf-8"))
          assert r["originalPublicPrints"]==14 and r["derivedObservableClusters"]==7, r
          assert r["publicPrintsInMultiPrintClusters"]==14, r
          assert r["originalFixedSizeCandidateEpisodes"]==0, r
          assert r["derivedClusterSizeCandidateEpisodes"]==1, r
          assert r["originalTotalLots"]==r["derivedTotalLots"]==700, r
          assert r["physicalBotCountKnown"] is False, r
          assert r["actualParentOrdersIdentified"] is False, r
          assert r["statisticalSignificanceEstablished"] is False, r
          PY
      - name: Standalone offline research dashboard CLI and data integrity smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- dashboard \
            --input fixtures/synthetic_activity_episode.csv \
            --window-minutes 5 --html /tmp/robot-dashboard.html \
            --json /tmp/robot-dashboard.json
          python3 - <<'PY'
          import json,pathlib
          report=json.loads(pathlib.Path("/tmp/robot-dashboard.json").read_text(encoding="utf-8"))
          html=pathlib.Path("/tmp/robot-dashboard.html").read_text(encoding="utf-8")
          assert report["publicPrints"] == 40, report
          assert report["populatedWindows"] == 5, report
          assert report["elevatedActivityWindows"] == 1, report
          assert sum(x["publicPrints"] for x in report["groups"]) == 40, report
          assert sum(x["publicPrints"] for x in report["windows"]) == 40, report
          assert report["feedCoverageVerified"] is False, report
          assert report["actualBotCountKnown"] is False, report
          assert report["statisticalSignificanceEstablished"] is False, report
          assert "<script" not in html.lower(), "HTML must not execute code"
          assert "Content-Security-Policy" in html
          assert "Наблюдался" in html
          assert "ACT000" not in html, "No raw trade identifiers in offline report"
          PY
      - name: Bounded event-time replay CLI smoke (no data loss)
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- replay-audit \
            --input fixtures/synthetic_twap_5s.csv --lateness-ms 500 \
            --max-pending 16 --window-minutes 5 --output /tmp/robot-replay.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-replay.json",encoding="utf-8"))
          assert r["inputPrints"]==7 and r["replayedPrints"]==7, r
          assert r["replayedLots"]==640, r
          assert r["populatedWindows"]==1, r
          assert r["maximumPendingObserved"]<=16, r
          assert r["forcedQueueFlushCount"]==0, r
          assert r["lateAfterWatermarkCount"]==0, r
          assert r["anyPrintsDropped"] is False, r
          assert r["hasActualNetworkReceiveTimestamps"] is False, r
          assert r["actualBotCountKnown"] is False, r
          PY
      - name: Standalone multi-archive comparison HTML/JSON smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- compare-archives \
            --inputs "fixtures/synthetic_twap_5s.csv;fixtures/synthetic_activity_episode.csv" \
            --window-minutes 5 \
            --html /tmp/robot-comparison.html --json /tmp/robot-comparison.json
          python3 - <<'PY'
          import json,pathlib
          r=json.load(open("/tmp/robot-comparison.json",encoding="utf-8"))
          html=pathlib.Path("/tmp/robot-comparison.html").read_text(encoding="utf-8")
          assert r["inputArchiveCount"]==2, r
          assert r["totalPublicPrints"]==47, r
          assert r["windowMinutes"]==5, r
          assert sum(x["publicPrints"] for x in r["archives"])==47, r
          assert r["comparableDataKinds"] is True, r
          assert r["actualBotCountKnown"] is False, r
          assert r["statisticalSignificanceEstablished"] is False, r
          assert "<script" not in html.lower()
          assert "Content-Security-Policy" in html
          assert "SYN001" not in html
          PY
      - name: Localhost HTTP snapshot API security and integration smoke
        shell: bash
        run: |
          set -euo pipefail
          # Intentionally pass a project-root-relative input: ASP.NET Web SDK
          # changes content root; the server resolves this safely by walking up.
          dotnet run --project src/RobotDetector.Server -c Release --no-build -- \
            --input fixtures/synthetic_activity_episode.csv --port 18765 \
            > /tmp/robot-detector-local-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          healthy=0
          for i in $(seq 1 60); do
            if curl -fsS --noproxy '*' \
              http://127.0.0.1:18765/api/v1/health > /tmp/rd-health.json; then
              healthy=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat /tmp/robot-detector-local-server.log
              exit 1
            fi
            sleep 0.2
          done
          test "$healthy" = "1"
          curl -fsS --noproxy '*' \
            http://127.0.0.1:18765/api/v1/summary > /tmp/rd-summary.json
          curl -fsS --noproxy '*' \
            http://127.0.0.1:18765/ > /tmp/rd-server.html
          curl -fsSI --noproxy '*' \
            http://127.0.0.1:18765/ > /tmp/rd-headers.txt
          post_code=$(curl -sS --noproxy '*' -o /dev/null \
            -w "%{http_code}" -X POST http://127.0.0.1:18765/api/v1/summary)
          host_code=$(curl -sS --noproxy '*' -o /dev/null \
            -w "%{http_code}" -H 'Host: attacker.example' http://127.0.0.1:18765/api/v1/summary)
          origin_code=$(curl -sS --noproxy '*' -o /dev/null \
            -w "%{http_code}" -H 'Origin: https://attacker.example' http://127.0.0.1:18765/api/v1/summary)
          unknown_code=$(curl -sS --noproxy '*' -o /dev/null \
            -w "%{http_code}" http://127.0.0.1:18765/api/v1/orders)
          test "$post_code" = "405"
          test "$host_code" = "403"
          test "$origin_code" = "403"
          test "$unknown_code" = "404"
          python3 - <<'PY'
          import json,pathlib
          h=json.loads(pathlib.Path("/tmp/rd-health.json").read_text(encoding="utf-8"))
          p=json.loads(pathlib.Path("/tmp/rd-summary.json").read_text(encoding="utf-8"))
          html=pathlib.Path("/tmp/rd-server.html").read_text(encoding="utf-8")
          headers=pathlib.Path("/tmp/rd-headers.txt").read_text(encoding="utf-8").lower()
          assert h["status"] == "offline_snapshot", h
          assert h["tradingEnabled"] is False, h
          assert h["liveMarketDataConnected"] is False, h
          assert h["actualBotCountKnown"] is False, h
          assert h["sourceCoverageVerified"] is False, h
          assert p["publicPrints"] == 40, p
          assert p["populatedWindows"] == 5, p
          assert p["elevatedActivityWindows"] == 1, p
          assert p["actualBotCountKnown"] is False, p
          assert p["statisticalSignificanceEstablished"] is False, p
          assert "<script" not in html.lower()
          assert "ACT000" not in html
          assert "content-security-policy:" in headers
          assert "x-frame-options: deny" in headers
          assert "cache-control: no-store" in headers
          PY
      - name: Blinded synthetic execution truth and non-identifiability smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- benchmark-blind \
            --seeds 2 --background-prints 35 --output /tmp/blind-execution-research.json
          python3 - <<'PY'
          import json
          p=json.load(open("/tmp/blind-execution-research.json",encoding="utf-8"))
          assert p["seedsPerKind"]==2 and p["cases"]==8, p
          assert {r["kind"] for r in p["results"]} == {
             "clustered_null","fixed_twap","variable_twap","partial_fill_twap"
          }, p
          assert p["canInferActualRealWorldRobotOwners"] is False, p
          assert p["isABidesExchangeSimulation"] is False, p
          for trial in p["results"]:
              assert len(trial["models"])==2, trial
              for model in trial["models"]:
                  assert not model["physicalProducerCountInferred"], model
                  assert model["truePositivePrints"] + model["falsePositivePrints"] == model["attributedPublicPrints"], model
                  assert model["missedInjectedPrints"] + model["truePositivePrints"] == trial["injectedExecutionPrints"], model
          assert all(r["injectedExecutionPrints"]==0 for r in p["results"]
                     if r["kind"]=="clustered_null")
          for kind in sorted({x["kind"] for x in p["results"]}):
              for model_name in ("fixed_quantity", "variable_quantity"):
                  cases=[next(m for m in x["models"] if m["model"]==model_name)
                         for x in p["results"] if x["kind"]==kind]
                  print("BLIND_SIMULATION_SUMMARY",json.dumps({
                      "scenario":kind,
                      "model":model_name,
                      "cases":len(cases),
                      "attributedPrints":sum(x["attributedPublicPrints"] for x in cases),
                      "syntheticTruePositivePrints":sum(x["truePositivePrints"] for x in cases),
                      "syntheticFalsePositivePrints":sum(x["falsePositivePrints"] for x in cases),
                      "syntheticMissedInjectedPrints":sum(x["missedInjectedPrints"] for x in cases),
                      "physicalRobotCountInferred":False,
                      "isABides":False
                  }))
          PY
      - name: Market-wide common-clock negative-control smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- benchmark-clock-null \
            --trials 3 --background-prints 60 --cycles 12 --period-ms 5000 \
            --output /tmp/clocked-null-stress.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/clocked-null-stress.json",encoding="utf-8"))
          assert r["trials"]==3 and len(r["cases"])==3 and len(r["models"])==2, r
          assert not r["identifiesRealRobotOwners"] and not r["isExchangeCalibrated"], r
          for case in r["cases"]:
              assert case["kind"]=="market_clock_null", case
              assert case["publicPrints"]==60, case
              assert case["trueSyntheticProducerCount"]==0, case
              assert case["injectedExecutionPrints"]==0, case
              for m in case["models"]:
                  assert m["truePositivePrints"]==0, m
                  assert m["missedInjectedPrints"]==0, m
                  assert m["eventRecall"] is None, m
                  assert m["falsePositivePrints"]==m["attributedPublicPrints"], m
                  assert not m["physicalProducerCountInferred"], m
          for row in r["models"]:
              records=[next(m for m in c["models"] if m["model"]==row["model"])
                       for c in r["cases"]]
              assert row["trials"]==3, row
              assert row["falseAlarmTrials"]==sum(m["attributedPublicPrints"]>0 for m in records), row
              assert row["falsePositivePublicPrints"]==sum(m["falsePositivePrints"] for m in records), row
              assert row["trialFalseAlarmFraction"]==row["falseAlarmTrials"]/3, row
              assert not row["calibratedMarketFalsePositiveRate"], row
              print("CLOCK_NULL_SUMMARY",json.dumps(row))
          PY
      - name: Variable-clip common-clock negative-control smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- benchmark-clock-null \
            --trials 3 --background-prints 60 --cycles 12 --period-ms 5000 \
            --clip-mode variable --output /tmp/clocked-null-variable.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/clocked-null-variable.json",encoding="utf-8"))
          assert r["clipMode"]=="variable", r
          assert r["trials"]==3 and len(r["cases"])==3 and len(r["models"])==2, r
          assert not r["identifiesRealRobotOwners"] and not r["isExchangeCalibrated"], r
          for case in r["cases"]:
              assert case["kind"]=="market_clock_variable_null", case
              assert case["publicPrints"]==60 and case["injectedExecutionPrints"]==0, case
              assert case["trueSyntheticProducerCount"]==0, case
              for m in case["models"]:
                  assert m["truePositivePrints"]==0 and m["eventRecall"] is None, m
                  assert m["falsePositivePrints"]==m["attributedPublicPrints"], m
                  assert not m["physicalProducerCountInferred"], m
          for row in r["models"]:
              records=[next(m for m in c["models"] if m["model"]==row["model"])
                       for c in r["cases"]]
              assert row["trials"]==3, row
              assert row["falseAlarmTrials"]==sum(m["attributedPublicPrints"]>0 for m in records), row
              assert row["falsePositivePublicPrints"]==sum(m["falsePositivePrints"] for m in records), row
              assert not row["calibratedMarketFalsePositiveRate"], row
              print("VARIABLE_CLOCK_NULL_SUMMARY",json.dumps(row))
          PY
      - name: Ensure no trade/order API dependency
        run: |
          if grep -REn 'PostOrder|CancelOrder|ReplaceOrder|OrdersService' src/; then
            echo "Trading API usage is forbidden in analytics project"
            exit 1
          fi
