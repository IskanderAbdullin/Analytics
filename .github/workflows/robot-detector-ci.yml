name: Robot Detector .NET CI

on:
  push:
    paths:
      - 'projects/robot-detector/**'
      - '.github/workflows/robot-detector-ci.yml'
  pull_request:
    paths:
      - 'projects/robot-detector/**'
      - '.github/workflows/robot-detector-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Core, CLI, and tests
        run: |
          dotnet build src/RobotDetector.Core/RobotDetector.Core.csproj -c Release --nologo
          dotnet build src/RobotDetector.Cli/RobotDetector.Cli.csproj -c Release --nologo
          dotnet build tests/RobotDetector.SelfTests/RobotDetector.SelfTests.csproj -c Release --nologo
      - name: Deterministic offline self-tests
        run: dotnet run --project tests/RobotDetector.SelfTests -c Release --no-build
      - name: CLI fixture smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- detect \
            --input fixtures/synthetic_twap_5s.csv --output /tmp/robot-detector-report.json
          python3 - <<'PY'
          import json
          p = json.load(open("/tmp/robot-detector-report.json", encoding="utf-8"))
          assert p["candidatePatternCount"] == 1, p
          q = p["patterns"][0]
          assert q["periodMilliseconds"] == 5000, q
          assert q["matchedCount"] == 6 and q["missedCycles"] == 1, q
          assert q["confidenceCalibrated"] is None, q
          assert p["physicalBotCountKnown"] is False, p
          PY
      - name: Conservative multi-window fusion smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- fusion \
            --input fixtures/synthetic_cross_hour_5s.csv \
            --output /tmp/robot-fusion.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-fusion.json",encoding="utf-8"))
          assert r["candidateEpisodeCount"] == 2, r
          assert r["conservativelyLinkedGroupCount"] == 1, r
          assert r["linkedEpisodeCount"] == 1, r
          assert r["uniqueAttributedPrintCount"] == 13, r
          assert r["uniqueAttributedLots"] == 1300, r
          assert r["actualBotCountKnown"] is False, r
          assert r["groups"][0]["confidenceCalibrated"] is None, r
          PY
      - name: Chronological multi-cutoff forecast smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- rolling-forecast \
            --input fixtures/synthetic_long_cadence_5min.csv \
            --min-matches 4 --warmup-minutes 20 --stride-minutes 10 \
            --max-cutoffs 4 --output /tmp/robot-rolling.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-rolling.json",encoding="utf-8"))
          assert r["cutoffsExamined"] == 4, r
          assert r["forecastsEvaluated"] >= 1, r
          assert r["observedHits"] >= 1, r
          assert r["placeboHits"] == 0, r
          assert r["actualBotCountKnown"] is False, r
          assert r["calibrated"] is False, r
          PY
      - name: Forecast failure diagnostic smoke (synthetic)
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- diagnose-forecast \
            --input fixtures/synthetic_long_cadence_5min.csv \
            --min-matches 4 --warmup-minutes 20 --stride-minutes 10 \
            --max-cutoffs 4 --output /tmp/robot-diagnostic.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-diagnostic.json",encoding="utf-8"))
          assert r["forecastsEvaluated"] == 4, r
          assert r["exactHits"] == 4, r
          assert r["misses"] == 0, r
          assert sum(x["evaluatedForecasts"] for x in r["historicalAgeBuckets"]) == 4, r
          assert r["actualBotCountKnown"] is False, r
          assert r["statisticalSignificanceEstablished"] is False, r
          PY
      - name: Recency-gated next-print forecast smoke (no future leakage)
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- rolling-forecast \
            --input fixtures/synthetic_long_cadence_5min.csv \
            --min-matches 4 --warmup-minutes 20 --stride-minutes 10 \
            --max-cutoffs 4 --max-training-age-cycles 2 \
            --output /tmp/robot-fresh.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-fresh.json",encoding="utf-8"))
          assert r["maximumTrainingAgeCycles"] == 2, r
          assert r["forecastsEvaluated"] == 4, r
          assert r["observedHits"] == 4, r
          assert r["placeboHits"] == 0, r
          assert r["calibrated"] is False, r
          assert r["actualBotCountKnown"] is False, r
          PY
      - name: Experimental variable-clip cadence and temporal controls smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- variable-cadence \
            --input fixtures/synthetic_variable_clip_5s.csv \
            --output /tmp/robot-variable.json
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- variable-temporal-null \
            --input fixtures/synthetic_variable_clip_5s.csv \
            --mode uniform --trials 3 --output /tmp/robot-variable-null.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-variable.json",encoding="utf-8"))
          assert r["candidateSequenceCount"] == 1, r
          assert r["candidates"][0]["periodMs"] == 5000, r
          assert r["candidates"][0]["distinctQuantities"] == 4, r
          assert r["candidates"][0]["matchedPrints"] == 12, r
          assert r["physicalBotCountKnown"] is False, r
          assert r["statisticalSignificanceEstablished"] is False, r
          n=json.load(open("/tmp/robot-variable-null.json",encoding="utf-8"))
          assert n["trialsRun"] == 3 and n["originalCandidateSequences"] == 1, n
          assert n["actualBotCountKnown"] is False and n["significanceCalibrated"] is False, n
          PY
      - name: Simple descriptive flow-footprint smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- flow-footprint \
            --input fixtures/synthetic_variable_clip_5s.csv --window-minutes 5 \
            --bin-seconds 1 --output /tmp/flow-footprint.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/flow-footprint.json",encoding="utf-8"))
          assert r["inputPrints"] == 12, r
          assert r["windowCount"] == 1, r
          w=r["windows"][0]
          assert w["publicPrintCount"] == 12, w
          assert w["totalLots"] == 300 and w["sellReportedLots"] == 300, w
          assert w["buyReportedLots"] == 0 and w["unknownDirectionLots"] == 0, w
          assert w["longestSellReportedRun"] == 12, w
          assert w["medianInterarrivalMs"] == 5000, w
          assert w["nearWholeSecondPrints"] == 12, w
          assert not r["actualBotCountKnown"] and not r["statisticalSignificanceEstablished"], r
          PY
      - name: Simple history-only activity burst smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- activity-episodes \
            --input fixtures/synthetic_activity_episode.csv \
            --output /tmp/robot-activity.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-activity.json",encoding="utf-8"))
          assert r["inputPrints"] == 40, r
          assert r["inputPopulatedWindows"] == 5, r
          assert r["evaluatedWindows"] == 1, r
          assert r["activityWindowCount"] == 1, r
          a=r["activityWindows"][0]
          assert a["publicPrintCount"] == 20 and a["totalLots"] == 2000, a
          assert a["baselineMedianPrintCount"] == 5, a
          assert a["baselineMedianLots"] == 50, a
          assert a["printCountRatio"] == 4 and a["totalLotsRatio"] == 40, a
          assert a["state"] == "unvalidated_observed_activity", a
          assert not a["actorIdentityKnown"], a
          assert not r["actualBotCountKnown"] and not r["significanceCalibrated"], r
          PY
      - name: Market-wide clock phase and minute-rotation null smoke
        run: |
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- clock-phase-audit \
            --input fixtures/synthetic_long_cadence_5min.csv \
            --min-prints 8 --trials 19 --seed 19 \
            --output /tmp/robot-market-clock.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/robot-market-clock.json",encoding="utf-8"))
          assert r["inputPrints"]==13, r
          assert r["sourceGroups"]==1 and r["eligibleSourceGroups"]==1, r
          assert r["ownerCountKnown"] is False and r["statisticalSignificanceEstablished"] is False, r
          g=r["groups"][0]
          assert g["printsInFirstMilliseconds"]==13, g
          assert g["observedFirstPhaseShare"]==1, g
          assert g["phaseHistogram100Ms"]==[13,0,0,0,0,0,0,0,0,0], g
          assert len(g["rotatedControlCounts"])==19, g
          assert g["nullMeanFirstPhaseShare"]<0.6, g
          assert g["maximumBinControl"]["peak100MsBin"]==0, g
          assert g["maximumBinControl"]["observedPeakBinCount"]==13, g
          assert len(g["maximumBinControl"]["rotatedMaximumBinCounts"])==19, g
          assert g["maximumBinControl"]["descriptiveAnyBinTailFrequency"] >= g["descriptiveGlobalTailFrequency"], g
          PY
      - name: Ensure no trade/order API dependency
        run: |
          if grep -REn 'PostOrder|CancelOrder|ReplaceOrder|OrdersService' src/; then
            echo "Trading API usage is forbidden in analytics project"
            exit 1
          fi
