name: VPS WSS edge response metrics (aggregate-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-wss-edge-metrics.yml'
      - 'projects/vps-api-control/wss_edge_metrics.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax preflight
        run: python -m py_compile projects/vps-api-control/wss_edge_metrics.py
      - name: Read only grouped Cloudflare Workers status codes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/vps-api-control/wss_edge_metrics.py
