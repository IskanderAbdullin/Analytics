name: Authenticated free-caption pilot
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/fta-authenticated-pilot/trigger.json']
permissions:
  contents: read
  statuses: write
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded authenticated pilot (never anonymous)
        env:
          FREETRANSCRIPT_API_KEY: ${{ secrets.FREETRANSCRIPT_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/fta-collector/fta_collector.py projects/fta-authenticated-pilot/queue.jsonl "$RUNNER_TEMP/ledger.jsonl" --limit 3 --require-key --execute
      - name: Report metadata only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import pathlib,os,json
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"ledger.jsonl"
          if p.exists():
           for line in p.read_text().splitlines():
            print("AUTH_FTA_LEDGER "+json.dumps(json.loads(line)))
          PY
          count=0
          if [ -f "$RUNNER_TEMP/ledger.jsonl" ]; then count=$(grep -c '"status":"archived_verified"' "$RUNNER_TEMP/ledger.jsonl" || true); fi
          state=failure
          if [ "$count" -gt 0 ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=fta-authenticated-pilot -f description="Verified archive receipts: $count" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
