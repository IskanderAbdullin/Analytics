name: Restore existing VPS admin named entrypoint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-admin-private-export.yml'
      - 'projects/cloudflare-control/vps_admin_export.py'
      - 'projects/cloudflare-control/vps_admin_export_request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dedicated-vps-private-export
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile only
        run: |
          gzip -dc projects/cloudflare-control/serverspace_deploy.py.gz > "$RUNNER_TEMP/serverspace_deploy.py"
          python -m py_compile "$RUNNER_TEMP/serverspace_deploy.py" projects/cloudflare-control/serverspace_rebuild.py projects/cloudflare-control/vps_admin_export.py
      - name: Preflight or restore only existing private export
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PYTHONPATH: ${{ runner.temp }}
        run: python -u projects/cloudflare-control/vps_admin_export.py
