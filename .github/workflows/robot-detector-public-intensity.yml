name: Robot Detector public intensity source tests
on:
  push:
    branches:
      - agent/robot-detector-l2-binphase-20261121
    paths:
      - 'projects/robot-detector/tools/public_intensity_rescaling.py'
      - 'projects/robot-detector/tests/test_public_intensity_rescaling.py'
      - 'projects/robot-detector/tools/public_m0_train_only.py'
      - 'projects/robot-detector/tests/test_public_m0_train_only.py'
      - 'projects/robot-detector/tools/public_m1_train_only.py'
      - 'projects/robot-detector/tests/test_public_m1_train_only.py'
      - 'projects/robot-detector/tools/public_m2_train_only.py'
      - 'projects/robot-detector/tests/test_public_m2_train_only.py'
      - 'projects/robot-detector/tools/public_run_allocation_gate.py'
      - 'projects/robot-detector/tests/test_public_run_allocation_gate.py'
      - 'projects/robot-detector/tools/public_evaluation_bounds.py'
      - 'projects/robot-detector/tests/test_public_evaluation_bounds.py'
      - 'projects/robot-detector/tools/public_paired_seed_inference.py'
      - 'projects/robot-detector/tests/test_public_paired_seed_inference.py'
      - 'projects/robot-detector/tools/public_hypothetical_power_grid.py'
      - 'projects/robot-detector/tests/test_public_hypothetical_power_grid.py'
      - 'projects/robot-detector/tools/public_m2_rescaled_gaps.py'
      - 'projects/robot-detector/tests/test_public_m2_rescaled_gaps.py'
      - 'projects/robot-detector/tools/public_m1_dynamic_l2.py'
      - 'projects/robot-detector/tests/test_public_m1_dynamic_l2.py'
      - 'projects/robot-detector/tools/public_m0_m1_m2_ambiguity_panel.py'
      - 'projects/robot-detector/tests/test_public_m0_m1_m2_ambiguity_panel.py'
      - 'projects/robot-detector/tools/public_fixed_intensity_likelihood.py'
      - 'projects/robot-detector/tests/test_public_fixed_intensity_likelihood.py'
      - 'projects/robot-detector/tools/public_crossmodel_heldout_ll.py'
      - 'projects/robot-detector/tests/test_public_crossmodel_heldout_ll.py'
      - 'projects/robot-detector/tools/public_post_event_bbo_projector.py'
      - 'projects/robot-detector/tests/test_public_post_event_bbo_projector.py'
      - 'projects/robot-detector/tools/public_lobster_clock_lag_audit.py'
      - 'projects/robot-detector/tests/test_public_lobster_clock_lag_audit.py'
      - 'projects/robot-detector/tools/public_lobster_ns_time.py'
      - 'projects/robot-detector/tests/test_public_lobster_ns_time.py'
      - 'projects/robot-detector/tools/public_m1_v3_ns_l2.py'
      - 'projects/robot-detector/tests/test_public_m1_v3_ns_l2.py'
      - 'projects/robot-detector/tools/public_ns_heldout_likelihood.py'
      - 'projects/robot-detector/tests/test_public_ns_heldout_likelihood.py'
      - 'projects/robot-detector/tools/public_ns_visible_exec_projector.py'
      - 'projects/robot-detector/tests/test_public_ns_visible_exec_projector.py'
      - 'projects/robot-detector/tools/public_ns_visible_integrated_ll.py'
      - 'projects/robot-detector/tests/test_public_ns_visible_integrated_ll.py'
      - '.github/workflows/robot-detector-public-intensity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run exact checked-out Python source tests (no external data)
        working-directory: projects/robot-detector
        run: python -m unittest discover -s tests -p 'test_public_*py' -v
      - name: Emit frozen three-tape aggregate-only LL panel (source-free; not owner inference)
        working-directory: projects/robot-detector
        run: python -m tools.public_crossmodel_heldout_ll
