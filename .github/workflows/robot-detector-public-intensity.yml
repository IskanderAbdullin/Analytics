      - 'projects/robot-detector/tests/test_public_abides_compact_160_eligibility.py'
      - 'projects/robot-detector/tools/public_abides_source_capture_preflight.py'
      - 'projects/robot-detector/tests/test_public_abides_source_capture_preflight.py'
      - 'projects/robot-detector/tools/public_abides_export_precision_ll.py'
      - 'projects/robot-detector/tests/test_public_abides_export_precision_ll.py'
      - 'projects/robot-detector/tools/public_abides_us_clock_ll_bounds.py'
      - 'projects/robot-detector/tests/test_public_abides_us_clock_ll_bounds.py'
      - '.github/workflows/robot-detector-public-intensity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run exact checked-out Python source tests (no external data)
        working-directory: projects/robot-detector
        run: python -m unittest discover -s tests -p 'test_public_*py' -v
      - name: Reproduce fixed ns public visible-type4 source-free aggregate
        working-directory: projects/robot-detector
        run: python -m tools.public_ns_repro_demo
      - name: Audit committed ABIDES 160 original compact metadata sufficiency only
        working-directory: projects/robot-detector
        run: python -m tools.public_abides_compact_160_eligibility
      - name: Emit ABIDES legacy CSV submicrosecond loss source-free likelihood falsifier
        working-directory: projects/robot-detector
        run: python -m tools.public_abides_export_precision_ll
      - name: Emit ABIDES non-target LL falsifier source-free aggregate
        working-directory: projects/robot-detector
        run: python -m tools.public_abides_m1v4_nontarget_panel
      - name: Emit frozen three-tape aggregate-only LL panel (source-free; not owner inference)
        working-directory: projects/robot-detector
        run: python -m tools.public_crossmodel_heldout_ll
