name: VPS API check private result without state changes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-api-read-result.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read allowlisted Cloudflare KV result only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m py_compile projects/vps-api-control/read_outcome.py
          python -u projects/vps-api-control/read_outcome.py
      - name: Publish result link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then state=success; desc="Private Serverspace inventory response verified";
          else state=failure; desc="Private Serverspace inventory not confirmed; see sanitized log"; fi
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="vps-api-provider-inventory-result" \
            -f description="$desc" \
            -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" >/dev/null
