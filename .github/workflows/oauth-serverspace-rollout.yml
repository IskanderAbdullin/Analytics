name: OAuth Serverspace private binding rollout
on:
  push:
    branches: [main]
    paths:
      - 'projects/cloudflare-control/oauth_rollout.py'
      - 'projects/cloudflare-control/oauth_rollout_request.json'
      - '.github/workflows/oauth-serverspace-rollout.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oauth-serverspace-private-rollout
  cancel-in-progress: false
jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile isolated code
        run: python -m py_compile projects/cloudflare-control/oauth_rollout.py
      - name: Plan or apply private OAuth MCP extension
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/cloudflare-control/oauth_rollout.py
