name: Robot Detector development-only failure forensics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/robot-detector-failure-forensics.yml'

permissions:
  contents: read

jobs:
  development-sber-november9-10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build all and verify development-only diagnostics in offline tests
        run: |
          dotnet build src/RobotDetector.Cli/RobotDetector.Cli.csproj -c Release --nologo
          dotnet build tests/RobotDetector.SelfTests/RobotDetector.SelfTests.csproj -c Release --nologo
          dotnet run --project tests/RobotDetector.SelfTests -c Release --no-build
      - name: Run read-only diagnostics on prespecified development days
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw data/results
          echo "DEVELOPMENT_ONLY: SBER_TQBR 2026-11-09 and 2026-11-10; sealed 12/13 November are excluded"
          curl -fsSL --connect-timeout 10 --max-time 30 \
            https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt \
            -o /tmp/russian_trusted_root_ca.crt
          openssl x509 -in /tmp/russian_trusted_root_ca.crt -noout -subject |
            grep -q 'Russian Trusted Root CA'
          pinned='D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31'
          actual="$(openssl x509 -in /tmp/russian_trusted_root_ca.crt -noout -fingerprint -sha256 | cut -d= -f2)"
          if [[ "$actual" != "$pinned" ]]; then
            echo 'BLOCKED_UNVERIFIED_CA: pinned root changed, refusing certificate bypass'
            exit 1
          fi
          export SSL_CERT_FILE=/tmp/russian_trusted_root_ca.crt
          for day in 2026-11-09 2026-11-10; do
            echo "DEVELOPMENT_DAY $day"
            raw="data/raw/sber_$day.csv"
            if ! dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
              fetch --date "$day" --instrument-id SBER_TQBR --output "$raw" \
              > /tmp/rd-fetch.log 2>&1; then
              echo "BLOCKED_BY_DATA: $day archive unavailable"
              sed -n '1,8p' /tmp/rd-fetch.log
              exit 1
            fi
            dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
              diagnose-forecast --input "$raw" --min-matches 6 \
              --warmup-minutes 60 --stride-minutes 30 --max-cutoffs 12 \
              --output "data/results/diagnostic_$day.json"
            DAY="$day" python3 - <<'PY'
          import json,os,pathlib
          day=os.environ["DAY"]
          p=pathlib.Path("data/results")/f"diagnostic_{day}.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          assert r["forecastsEvaluated"] == r["exactHits"]+r["misses"]
          assert r["exactHits"] <= r["forecastsEvaluated"]
          assert r["placeboHits"] <= r["forecastsEvaluated"]
          assert sum(b["evaluatedForecasts"] for b in r["historicalAgeBuckets"]) == r["forecastsEvaluated"]
          assert not r["actualBotCountKnown"] and not r["statisticalSignificanceEstablished"]
          print("DEVELOPMENT_FAILURE_DIAGNOSTIC",json.dumps({
            "day":day,
            "fileSha256":r["sourceSha256"],
            "checks":r["forecastsEvaluated"],
            "exactHits":r["exactHits"],
            "placeboHits":r["placeboHits"],
            "misses":r["misses"],
            "sameSizeLateOrEarly":r["missesWithSameSizeOutsideExactWindow"],
            "differentSizeAtExactTarget":r["missesWithDifferentSizeInsideExactWindow"],
            "differentSizeNearTarget":r["missesWithDifferentSizeNearTarget"],
            "oppositeSideAtExactTarget":r["missesWithOppositeDirectionInsideExactWindow"],
            "noSameSideNearby":r["missesWithNoSameSidePrintNearTarget"],
            "incompleteBroadAuditWindow":r["missesWithIncompleteNearbyWindow"],
            "staleHistoryMisses":r["missesWithStaleTrainingPattern"],
            "roundSecondTargetForecasts":r["nearWholeSecondTargetForecasts"],
            "roundSecondTargetHits":r["nearWholeSecondTargetHits"],
            "historicalAgeBuckets":r["historicalAgeBuckets"],
            "coverageVerified":r["dataCoverageVerified"]
          },ensure_ascii=False))
          PY
          done
          echo "DEVELOPMENT_DIAGNOSTICS_FINISHED: descriptive clues only; no confirmed bots"
      - name: Remove all downloaded public raw trade data and temporary CA
        if: always()
        shell: bash
        run: |
          rm -rf data/raw data/results
          rm -f /tmp/russian_trusted_root_ca.crt /tmp/rd-fetch.log
