name: Confirm Serverspace private Worker export
on:
  push:
    branches: [main]
    paths: ['.github/workflows/serverspace-export-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read current named Worker exports without secrets in output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          aid=os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token=os.environ["CLOUDFLARE_API_TOKEN"]
          base="https://api.cloudflare.com/client/v4/accounts/"+aid+"/workers/scripts/babit-vps-bridge/"
          def get(path):
              req=urllib.request.Request(base+path,headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
              with urllib.request.urlopen(req,timeout=15) as r:
                  val=json.loads(r.read(200000))
              if not val.get("success"):raise RuntimeError("CLOUDFLARE_API_REJECTED")
              return val.get("result")
          try:
              d=get("deployments")
              seq=d.get("deployments") if isinstance(d,dict) else d
              if not isinstance(seq,list) or not seq:raise RuntimeError("NO_DEPLOYMENTS")
              versions=seq[0].get("versions") or []
              version=next((x.get("version_id") for x in versions if x.get("percentage")==100),None)
              if not version:raise RuntimeError("NO_ACTIVE_VERSION")
              v=get("versions/"+version)
              names=(v.get("resources") or {}).get("script_runtime",{}).get("exports") or {}
              if not names:names=v.get("exports") or {}
              result={"private_serverspace_export":names.get("ServerspaceReadOnlyEntrypoint",{}).get("type")=="worker",
                      "existing_vps_relay_export":"VpsAgentRelay" in names,
                      "existing_vps_admin_export":"VpsAdminEntrypoint" in names,
                      "exports_available":bool(names)}
              print(json.dumps(result))
              if not result["private_serverspace_export"]:raise RuntimeError("NEW_EXPORT_MISSING")
          except Exception as ex:
              print("VERIFY_FAILED",str(ex) if str(ex).isupper() else type(ex).__name__)
              raise
          PY
