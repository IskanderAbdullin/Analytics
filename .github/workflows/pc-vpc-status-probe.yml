name: Existing PC VPC HTTP reachability
on:
  push:
    branches: [chatgpt/cloudflare-control-20261123]
    paths:
      - '.github/workflows/pc-vpc-status-probe.yml'
      - 'projects/cloudflare-control/pc_vpc_status_probe.*'
permissions:
  contents: read
concurrency:
  group: pc-vpc-status-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax checks
        run: |
          python -m py_compile projects/cloudflare-control/pc_vpc_status_probe.py
          node --check projects/cloudflare-control/pc_vpc_status_probe.mjs
      - name: Fixed unsigned status reachability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python projects/cloudflare-control/pc_vpc_status_probe.py
