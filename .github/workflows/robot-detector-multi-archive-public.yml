name: Robot Detector public SBER/MOEX multi-archive comparison

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/robot-detector-multi-archive-public.yml'

permissions:
  contents: read

jobs:
  compare-two-instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and test independent comparison models
        run: |
          dotnet build src/RobotDetector.Cli/RobotDetector.Cli.csproj -c Release --nologo
          dotnet build tests/RobotDetector.SelfTests/RobotDetector.SelfTests.csproj -c Release --nologo
          dotnet run --project tests/RobotDetector.SelfTests -c Release --no-build
      - name: Compare two anonymous public archives with exact same UTC window width
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw data/results
          curl -fsSL --connect-timeout 10 --max-time 30 \
            https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt \
            -o /tmp/russian_trusted_root_ca.crt
          openssl x509 -in /tmp/russian_trusted_root_ca.crt -noout -subject |
            grep -q 'Russian Trusted Root CA'
          pinned='D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31'
          actual="$(openssl x509 -in /tmp/russian_trusted_root_ca.crt -noout -fingerprint -sha256 | cut -d= -f2)"
          if [[ "$actual" != "$pinned" ]]; then
            echo 'BLOCKED_UNVERIFIED_CA: pinned official root changed'
            exit 1
          fi
          export SSL_CERT_FILE=/tmp/russian_trusted_root_ca.crt
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
            fetch --date 2026-11-17 --instrument-id SBER_TQBR \
            --output data/raw/SBER-2026-11-17.csv
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
            fetch --date 2026-11-17 --instrument-id MOEX_TQBR \
            --output data/raw/MOEX-2026-11-17.csv
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
            compare-archives \
            --inputs "data/raw/SBER-2026-11-17.csv;data/raw/MOEX-2026-11-17.csv" \
            --window-minutes 5 \
            --html data/results/comparison.html --json data/results/comparison.json
          python3 - <<'PY'
          import json,pathlib
          p=json.loads(pathlib.Path("data/results/comparison.json").read_text(encoding="utf-8"))
          html=pathlib.Path("data/results/comparison.html").read_text(encoding="utf-8")
          assert p["inputArchiveCount"] == 2
          assert p["windowMinutes"] == 5
          assert p["comparableDataKinds"] is True
          assert p["totalPublicPrints"] == sum(a["publicPrints"] for a in p["archives"])
          assert p["totalObservedLots"] == sum(a["observedLots"] for a in p["archives"])
          assert p["totalPublicPrints"] > 0
          assert len({a["sourceSha256"] for a in p["archives"]}) == 2
          assert not p["actualBotCountKnown"] and not p["statisticalSignificanceEstablished"]
          assert not p["sourceCoverageVerified"]
          assert all(a["publicPrints"] > 0 for a in p["archives"])
          assert "<script" not in html.lower()
          assert "Content-Security-Policy" in html
          assert "SYN001" not in html
          for a in p["archives"]:
              print("MULTI_ARCHIVE_OBSERVED",json.dumps({
                "file":a["sourceFileName"],
                "sha":a["sourceSha256"],
                "instruments":a["instrumentNames"],
                "sourceModes":a["sourceModes"],
                "publicPrints":a["publicPrints"],
                "lots":a["observedLots"],
                "windows":a["populatedWindows"],
                "activityWindows":a["elevatedActivityWindows"],
                "collisionShare":a["timestampCollisionShare"],
                "nearWholeSecondShare":a["nearWholeSecondPrintShare"],
                "medianWindowFano":a["medianWindowFano"],
                "coverageVerified":a["feedCoverageVerified"]
              },ensure_ascii=False))
          print("MULTI_ARCHIVE_SUMMARY",p["totalPublicPrints"],p["totalObservedLots"])
          PY
          echo "MULTI_ARCHIVE_SMOKE_SUCCEEDED: no raw file or generated HTML artifact uploaded"
      - name: Remove all raw exchange files and temporary root
        if: always()
        shell: bash
        run: |
          rm -rf data/raw data/results
          rm -f /tmp/russian_trusted_root_ca.crt
