name: Robot Detector genuine ABIDES-NG blinded integration

on:
  push:
    paths:
      - 'projects/robot-detector/src/**'
      - 'projects/robot-detector/tools/abides_export.py'
      - 'projects/robot-detector/tests_python/**'
      - 'projects/robot-detector/tests/RobotDetector.SelfTests/**'
      - '.github/workflows/robot-detector-abides-real.yml'
  pull_request:
    paths:
      - 'projects/robot-detector/src/**'
      - 'projects/robot-detector/tools/abides_export.py'
      - 'projects/robot-detector/tests_python/**'
      - 'projects/robot-detector/tests/RobotDetector.SelfTests/**'
      - '.github/workflows/robot-detector-abides-real.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genuine-abides-public-private:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test pure Python public/private projection
        run: python -m unittest discover -s tests_python -p 'test_*.py' -v
      - name: Install pinned upstream genuine ABIDES-NG simulator
        run: |
          git clone --no-tags --filter=blob:none https://github.com/GabrieleDiCorato/abides-ng.git /tmp/abides-ng
          git -C /tmp/abides-ng checkout --detach ac7a2a7bf6e406cd2bbed887e22c5a5a790bb242
          python -m pip install --disable-pip-version-check -e /tmp/abides-ng/abides-core -e /tmp/abides-ng/abides-markets
          python -c 'from abides_markets.simulation import run_simulation; print("genuine_abides_import_ok")'
      - name: Run actual ABIDES matching simulation with one TWAP and one null
        run: |
          python tools/abides_export.py --mode twap --seed 41 \
            --public /tmp/abides_twap_public.csv --truth /tmp/abides_twap_truth.json
          python tools/abides_export.py --mode null --seed 42 \
            --public /tmp/abides_null_public.csv --truth /tmp/abides_null_truth.json
      - name: Test C# core, source schema, and exact public/private reconciliation
        run: |
          dotnet run --project tests/RobotDetector.SelfTests -c Release
          dotnet run --project src/RobotDetector.Cli -c Release -- benchmark-abides-blind \
            --public /tmp/abides_twap_public.csv --truth /tmp/abides_twap_truth.json \
            --output /tmp/abides_twap_report.json
          dotnet run --project src/RobotDetector.Cli -c Release -- benchmark-abides-blind \
            --public /tmp/abides_null_public.csv --truth /tmp/abides_null_truth.json \
            --output /tmp/abides_null_report.json
          python3 - <<'PY'
          import csv,hashlib,json
          for kind in ('twap','null'):
              public = open(f'/tmp/abides_{kind}_public.csv','rb').read()
              private = json.load(open(f'/tmp/abides_{kind}_truth.json'))
              report = json.load(open(f'/tmp/abides_{kind}_report.json'))
              rows = list(csv.DictReader(public.decode().splitlines()))
              assert len(rows)>0 and len(rows)==len(private['events'])==report['publicPrints']
              assert hashlib.sha256(public).hexdigest()==private['public_sha256']==report['publicSha256']
              assert 'passive_agent_id' not in rows[0] and 'aggressive_agent_id' not in rows[0]
              assert len({r['EVENT_ID'] for r in rows})==len(rows)
              assert report['simulator']=='abides-ng'
              assert report['physicalOwnerIdentityKnown'] is False
              assert report['realMarketAccuracyCalibrated'] is False
              assert report['liveTradingEnabled'] is False
              control=set(private['controlled_agent_ids'])
              counted=sum(e['passive_agent_id'] in control or e['aggressive_agent_id'] in control
                          for e in private['events'])
              assert report['controlledPrints']==counted
              assert report['backgroundPrints']==len(rows)-counted
              if kind=='twap': assert counted>0 and len(control)==1
              else: assert counted==0 and len(control)==0
              for m in report['models']:
                  assert m['truePositivePrints']+m['falsePositivePrints']==m['attributedPublicPrints']
                  assert m['truePositivePrints']+m['missedInjectedPrints']==counted
                  assert not m['physicalProducerCountInferred']
                  if kind=='null': assert m['eventRecall'] is None
              print('GENUINE_ABIDES_BLIND', json.dumps({
                  'kind':kind,'public_prints':len(rows),'controlled_prints':counted,
                  'models':report['models'],'upstream':private['simulator_revision']
              }))
          PY
      - name: Real VWAP and POV execution-agent projection cross-check
        run: |
          python tools/abides_export.py --mode vwap --seed 43 \
            --public /tmp/abides_vwap.csv --truth /tmp/abides_vwap_private.json
          python tools/abides_export.py --mode pov --seed 44 \
            --public /tmp/abides_pov.csv --truth /tmp/abides_pov_private.json
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- benchmark-abides-blind \
            --public /tmp/abides_vwap.csv --truth /tmp/abides_vwap_private.json \
            --output /tmp/abides_vwap_report.json
          dotnet run --project src/RobotDetector.Cli -c Release --no-build -- benchmark-abides-blind \
            --public /tmp/abides_pov.csv --truth /tmp/abides_pov_private.json \
            --output /tmp/abides_pov_report.json
          python3 - <<'PY'
          import json
          for kind in ("vwap","pov"):
              truth=json.load(open(f"/tmp/abides_{kind}_private.json", encoding="utf-8"))
              report=json.load(open(f"/tmp/abides_{kind}_report.json", encoding="utf-8"))
              control=set(truth["controlled_agent_ids"])
              controlled=sum(e["passive_agent_id"] in control or e["aggressive_agent_id"] in control
                             for e in truth["events"])
              assert len(control)==1 and controlled>0,(kind,control,controlled)
              assert report["publicPrints"] == len(truth["events"])
              assert report["controlledPrints"]==controlled
              assert not report["physicalOwnerIdentityKnown"]
              assert not report["realMarketAccuracyCalibrated"]
              for model in report["models"]:
                  assert model["truePositivePrints"]+model["falsePositivePrints"]==model["attributedPublicPrints"]
                  assert model["truePositivePrints"]+model["missedInjectedPrints"]==controlled
              print("ABIDES_ALT_EXECUTION",json.dumps({"mode":kind,"public_prints":report["publicPrints"],
                   "controlled_prints":controlled,"models":report["models"]}))
          PY
      - name: Public-only volume-response diagnostics on spent development seeds
        run: |
          # Only pre-existing development seeds 41/42/43/44. Do not fit thresholds
          # or inspect the frozen 901..904 private truth for model selection.
          for kind in twap null vwap pov; do
            case "$kind" in
              twap) public=/tmp/abides_twap_public.csv ;;
              null) public=/tmp/abides_null_public.csv ;;
              vwap) public=/tmp/abides_vwap.csv ;;
              pov) public=/tmp/abides_pov.csv ;;
            esac
            dotnet run --project src/RobotDetector.Cli -c Release --no-build -- volume-response \
              --input "$public" --bin-seconds 30 --min-pairs 8 \
              --output "/tmp/abides_public_volume_${kind}.json"
          done
          python3 - <<'PY'
          import json,math
          for kind in ('twap','null','vwap','pov'):
              r=json.load(open(f'/tmp/abides_public_volume_{kind}.json',encoding='utf-8'))
              assert r['inputPublicPrints']>0 and r['evaluatedSourceGroups']>0,r
              assert r['skippedDenseGroups']==0,r
              assert not r['physicalBotCountKnown'] and not r['statisticalSignificanceEstablished'],r
              assert r['sourceCoverageVerified'] is False,r
              assert len(r['sideProfiles'])==2*r['evaluatedSourceGroups'],r
              assert all(not v['ownerIdentityKnown'] and not v['significanceCalibrated']
                         for v in r['sideProfiles']),r
              assert all(o['previousTotalMarketLots']>0 and o['currentTotalMarketLots']>0
                         for o in r['observations']),r
              assert all(v['spearmanPreviousMarketLotsToCurrentSideLots'] is None or
                         -1.000001<=v['spearmanPreviousMarketLotsToCurrentSideLots']<=1.000001
                         for v in r['sideProfiles']),r
              # Public-only associations are descriptive, not synthetic-actor scores.
              print('ABIDES_PUBLIC_VOLUME_DEV',json.dumps({
                  'kind':kind,'public':r['inputPublicPrints'],
                  'adjacent_observations':len(r['observations']),
                  'side_associations':[
                      {'direction':v['reportedDirection'],
                       'rho_lag':v['spearmanPreviousMarketLotsToCurrentSideLots'],
                       'pairs':v['eligibleAdjacentPairs']}
                      for v in r['sideProfiles']]
              }))
          PY
      - name: Separate development-seed public-only volume null survey
        run: |
          # Fresh development seeds, not the spent frozen 901..904 evaluation set.
          # No private execution truth is passed to or read by this descriptor.
          python tools/volume_response_dev_survey.py --dev-seeds 61 62 63 \
            --cli-dll src/RobotDetector.Cli/bin/Release/net10.0/RobotDetector.Cli.dll \
            --output /tmp/abides-public-volume-dev-survey.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/abides-public-volume-dev-survey.json',encoding='utf-8'))
          assert r['development_seeds']==[61,62,63],r
          assert r['case_count']==9 and len(r['public_summary'])==6,r
          assert r['private_truth_exported'] is False,r
          assert r['candidate_model_fitted'] is False,r
          assert r['bot_owner_identity_known'] is False,r
          assert r['real_market_specificity_known'] is False,r
          for row in r['public_summary']:
              assert row['simulated_runs']==3,row
              assert not row['owner_identity_known'] and not row['significance_calibrated'],row
              assert row['mode'] in ('null','pov','vwap'),row
          PY
      - name: Independent development ABIDES public directional-shift null survey
        run: |
          # New exploratory seeds 71-73; never use spent frozen 901-904 truth
          # to choose thresholds. Private simulator labels are discarded.
          python tools/directional_shift_dev_survey.py --dev-seeds 71 72 73 \
            --cli-dll src/RobotDetector.Cli/bin/Release/net10.0/RobotDetector.Cli.dll \
            --output /tmp/abides_directional_shift_dev.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/abides_directional_shift_dev.json',encoding='utf-8'))
          assert r['development_seeds']==[71,72,73],r
          assert len(r['cases'])==9 and len(r['cohorts'])==3,r
          assert r['input_mode']=='public_only',r
          assert r['private_truth_used_for_detection'] is False,r
          assert r['physical_owner_count_known'] is False,r
          assert r['statistical_significance_established'] is False,r
          assert r['trading_enabled'] is False,r
          for mode in ('null','vwap','pov'):
              cohort=next(v for v in r['cohorts'] if v['mode']==mode)
              assert cohort['simulations']==3,cohort
              assert not cohort['robot_identity_known'],cohort
              assert not cohort['market_false_alarm_rate_calibrated'],cohort
              assert cohort['observed_directional_shift_windows']>=0,cohort
              assert cohort['evaluated_bins']>=0,cohort
          PY
      - name: Pre-registered fresh synthetic direction-shift replication
        run: |
          # Plan and unchanged thresholds were committed BEFORE looking at
          # any 1101-1104 output. No private ABIDES labels are used.
          python tools/directional_shift_frozen_replication.py \
            --cli-dll src/RobotDetector.Cli/bin/Release/net10.0/RobotDetector.Cli.dll \
            --output /tmp/abides-directional-shift-frozen.json
          python3 - <<'PY'
          import json
          p='/tmp/abides-directional-shift-frozen.json'
          r=json.load(open(p,encoding='utf-8'))
          assert r['cohort_type']=='pre_registered_synthetic_replication',r
          assert r['pre_registered_plan']['seeds']==[1101,1102,1103,1104],r
          assert r['pre_registered_plan']['parameters']['minimum_absolute_buy_share_change']==0.25,r
          assert len(r['cases'])==12 and len(r['cohorts'])==3,r
          assert r['physical_owner_count_known'] is False,r
          assert r['private_truth_used_for_detection'] is False,r
          for c in r['cohorts']:
              assert c['simulations']==4,c
              assert not c['robot_identity_known'],c
              assert not c['market_false_alarm_rate_calibrated'],c
              assert c['observed_directional_shift_windows']>=0,c
          PY
      - name: Pre-registered executed-fill baseline across TWAP VWAP POV and null
        run: |
          # Exact seeds/modes & default existing detector parameters were frozen
          # in source before collecting any 1301-1304 baseline outcomes.
          python tools/abides_execution_baseline_holdout.py \
            --cli-dll src/RobotDetector.Cli/bin/Release/net10.0/RobotDetector.Cli.dll \
            --output /tmp/abides_strategy_baseline_frozen.json
          python3 - <<'PY'
          import json
          r=json.load(open('/tmp/abides_strategy_baseline_frozen.json',encoding='utf-8'))
          assert r['frozen_plan']['seeds']==[1301,1302,1303,1304],r
          assert r['frozen_plan']['screens']==['fixed_quantity','variable_quantity'],r
          assert r['case_count']==16 and len(r['cases'])==16,r
          assert len(r['aggregates'])==8,r
          assert r['private_truth_retained_in_artifact'] is False,r
          assert r['models_tuned_on_frozen_seeds'] is False,r
          assert r['physical_owner_count_known'] is False,r
          assert r['real_market_accuracy_calibrated'] is False,r
          for row in r['aggregates']:
              assert row['cases']==4,row
              assert row['true_positive_prints']+row['missed_controlled_prints']==row['controlled_prints'],row
              assert row['true_positive_prints']+row['false_positive_prints']==row['attributed_public_prints'],row
              assert not row['physical_owner_count_known'] and not row['real_market_accuracy_calibrated'],row
              if row['mode']=='null':
                  assert row['controlled_prints']==0 and row['pooled_event_recall'] is None,row
              else:
                  assert row['controlled_prints']>0,row
          PY
      - name: Frozen-seed cross-run blinded replication
        run: |
          python tools/abides_batch.py --holdout-seeds 901 902 903 904 \
            --cli-dll src/RobotDetector.Cli/bin/Release/net10.0/RobotDetector.Cli.dll \
            --output /tmp/abides_holdout_4seeds.json
          python3 - <<'PY'
          import json
          r=json.load(open("/tmp/abides_holdout_4seeds.json",encoding="utf-8"))
          assert r["holdout_seeds"]==[901,902,903,904],r
          assert r["case_count"]==8 and len(r["cases"])==8,r
          assert len(r["aggregates"])==4,r
          assert r["physical_owner_count_known"] is False,r
          assert r["market_accuracy_calibrated"] is False,r
          for row in r["aggregates"]:
              assert row["cases"]==4,row
              assert row["true_positive_prints"]+row["missed_controlled_prints"]==row["controlled_prints"],row
              assert row["true_positive_prints"]+row["false_positive_prints"]==row["attributed_public_prints"],row
              assert not row["market_accuracy_calibrated"],row
              if row["mode"]=="null":
                  assert row["controlled_prints"]==0 and row["micro_event_recall"] is None,row
          PY
      - name: Upload frozen synthetic execution-strategy baseline (aggregate only)
        uses: actions/upload-artifact@v4
        with:
          name: abides-frozen-executed-strategy-baseline
          path: /tmp/abides_strategy_baseline_frozen.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload pre-registered synthetic direction-shift replication
        uses: actions/upload-artifact@v4
        with:
          name: abides-public-direction-shift-frozen
          path: /tmp/abides-directional-shift-frozen.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload direction-change public-only development aggregates
        uses: actions/upload-artifact@v4
        with:
          name: abides-public-direction-shift-development
          path: /tmp/abides_directional_shift_dev.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload public-only development volume summary
        uses: actions/upload-artifact@v4
        with:
          name: abides-public-volume-development
          path: /tmp/abides-public-volume-dev-survey.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload aggregate blinded scores only (no private truth)
        uses: actions/upload-artifact@v4
        with:
          name: abides-frozen-holdout-aggregate
          path: /tmp/abides_holdout_4seeds.json
          retention-days: 14
          if-no-files-found: error
      - name: Keep original and private broker data off the repository
        run: |
          test ! -e data/raw/abides_twap_truth.json
          test ! -e data/results/abides_null_truth.json
          if grep -REn 'PostOrder|CancelOrder|ReplaceOrder|OrdersService' src/; then
            echo 'Trading API forbidden'
            exit 1
          fi
