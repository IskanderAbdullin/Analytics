name: PC job discovery read-only cloud preflight
on:
  push:
    branches: [chatgpt/pc-job-list-cloud-1124]
    paths:
      - '.github/workflows/pc-job-list-preflight.yml'
      - 'projects/cloudflare-control/pc_job_list_preflight.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pc-job-discovery-readonly
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile read-only probe
        run: python -m py_compile projects/cloudflare-control/pc_job_list_preflight.py
      - name: Verify live PC tool registration and immutable baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/cloudflare-control/pc_job_list_preflight.py
