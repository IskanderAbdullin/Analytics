name: Existing PC tunnel readiness
on:
  push:
    branches: [chatgpt/cloudflare-control-20261123]
    paths:
      - '.github/workflows/pc-tunnel-readiness.yml'
      - 'projects/cloudflare-control/pc_tunnel_readiness.py'
      - 'projects/cloudflare-control/test_pc_tunnel_readiness.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests
        working-directory: projects/cloudflare-control
        run: python -m unittest test_pc_tunnel_readiness -v
      - name: Read existing named tunnel readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python projects/cloudflare-control/pc_tunnel_readiness.py
