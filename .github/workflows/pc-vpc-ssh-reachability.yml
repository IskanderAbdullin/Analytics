name: Existing PC tunnel TCP 22 reachability
on:
  push:
    branches: [chatgpt/cloudflare-control-20261123]
    paths:
      - '.github/workflows/pc-vpc-ssh-reachability.yml'
      - 'projects/cloudflare-control/pc_vpc_ssh_reachability.*'
permissions:
  contents: read
concurrency:
  group: pc-vpc-ssh-reachability
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax checks
        run: |
          python -m py_compile projects/cloudflare-control/pc_vpc_ssh_reachability.py
          node --check projects/cloudflare-control/pc_vpc_ssh_reachability.mjs
          node --test projects/cloudflare-control/test_pc_vpc_ssh_reachability.mjs
      - name: Fixed loopback TCP 22 reachability
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python projects/cloudflare-control/pc_vpc_ssh_reachability.py
