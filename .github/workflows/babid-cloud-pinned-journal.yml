name: Babid Cloud — pinned production Journal source synthetic tests
on:
  push:
    paths:
      - "projects/babid-cloud-analysis/**"
      - ".github/workflows/babid-cloud-pinned-journal.yml"
  pull_request:
    paths:
      - "projects/babid-cloud-analysis/**"
      - ".github/workflows/babid-cloud-pinned-journal.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: babid-pinned-journal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-source-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout public Analytics
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Checkout pinned public Babid source (read-only)
        uses: actions/checkout@v5
        with:
          repository: IskanderAbdullin/Babid-C-gpt-
          ref: 5b553afdffe0679960d1b161a4885a645175e60b
          path: source-babid
          persist-credentials: false
      - name: Check exact original Git blobs
        shell: bash
        run: |
          test "$(git hash-object source-babid/BabidCCloud/src/Babid01/Core/Domain.cs)" = "52ce371395d3b7b58ba093f4f9cb4a459ea4fb1f"
          test "$(git hash-object source-babid/BabidCCloud/src/Babid01/Trading/Journal.cs)" = "011a5165c5624f1783432c26bb883a03d6180a84"
      - name: Setup dotnet SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile and execute actual source-only Journal regression
        run: dotnet run --project projects/babid-cloud-analysis/analysis/csharp-journal-replay/JournalReplay.csproj --configuration Release
      - name: State scope
        shell: bash
        run: |
          echo "Original public source pinned by commit and blob SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "Only synthetic Journal data; no broker, no trading robot, no private source." >> "$GITHUB_STEP_SUMMARY"
