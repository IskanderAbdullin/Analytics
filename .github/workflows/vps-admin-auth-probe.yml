name: VPS admin private HMAC rejection probe
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-admin-auth-probe.yml'
      - 'projects/vps-api-control/auth_probe.py'
      - 'projects/vps-api-control/auth_probe_request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-existing-diagnostic-worker-auth-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source without executing any VPS operation
        run: |
          python -m py_compile projects/vps-api-control/auth_probe.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"projects/vps-api-control")
          from auth_probe import JS
          Path("/tmp/ss-auth-check.mjs").write_text(JS)
          PY
          node --check /tmp/ss-auth-check.mjs
      - name: Stage private unsigned probe or read only safe status
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/vps-api-control/auth_probe.py
