name: Robot Detector clock phase public cross-instrument pilot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/robot-detector-clock-cross-instrument.yml'

permissions:
  contents: read

jobs:
  public-sber-moex-clock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and run independent synthetic clock tests
        run: |
          dotnet build src/RobotDetector.Cli/RobotDetector.Cli.csproj -c Release --nologo
          dotnet build tests/RobotDetector.SelfTests/RobotDetector.SelfTests.csproj -c Release --nologo
          dotnet run --project tests/RobotDetector.SelfTests -c Release --no-build
      - name: Compare 100ms clock phase to shared-minute controls on two public instruments
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/raw data/results
          echo "CLOCK_PILOT_READ_ONLY: SBER_TQBR and MOEX_TQBR for 2026-11-18, no broker credentials"
          curl -fsSL --connect-timeout 10 --max-time 30 \
            https://gu-st.ru/content/lending/russian_trusted_root_ca_pem.crt \
            -o /tmp/russian_trusted_root_ca.crt
          openssl x509 -in /tmp/russian_trusted_root_ca.crt -noout -subject |
            grep -q 'Russian Trusted Root CA'
          pinned='D2:6D:2D:02:31:B7:C3:9F:92:CC:73:85:12:BA:54:10:35:19:E4:40:5D:68:B5:BD:70:3E:97:88:CA:8E:CF:31'
          actual="$(openssl x509 -in /tmp/russian_trusted_root_ca.crt -noout -fingerprint -sha256 | cut -d= -f2)"
          if [[ "$actual" != "$pinned" ]]; then
            echo "BLOCKED_UNVERIFIED_CA: official certificate fingerprint mismatch, no bypass"
            exit 1
          fi
          export SSL_CERT_FILE=/tmp/russian_trusted_root_ca.crt
          for instrument in SBER_TQBR MOEX_TQBR; do
            raw="data/raw/$instrument-2026-11-18.csv"
            fetched=0
            for attempt in 1 2 3; do
              rm -f "$raw"
              if timeout 90 dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
                fetch --date 2026-11-18 --instrument-id "$instrument" --output "$raw" \
                > /tmp/clock-fetch.log 2>&1; then
                fetched=1
                break
              fi
              echo "PUBLIC_FETCH_RETRY: instrument=$instrument attempt=$attempt"
              if [[ $attempt -lt 3 ]]; then sleep 5; fi
            done
            if [[ $fetched -ne 1 ]]; then
              echo "BLOCKED_BY_DATA: $instrument archive inaccessible after 3 bounded attempts"
              sed -n '1,8p' /tmp/clock-fetch.log
              exit 1
            fi
            dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
              clock-phase-audit --input "$raw" --first-ms 100 \
              --min-prints 100 --trials 99 --seed 20261119 \
              --output "data/results/clock_$instrument.json"
            dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
              timestamp-quality --input "$raw" \
              --output "data/results/quality_$instrument.json"
            dotnet run --project src/RobotDetector.Cli -c Release --no-build -- \
              cluster-compare --input "$raw" --min-matches 6 \
              --output "data/results/clusters_$instrument.json"
            INSTRUMENT="$instrument" python3 - <<'PY'
          import os,json,pathlib
          instrument=os.environ["INSTRUMENT"]
          p=pathlib.Path("data/results")/f"clock_{instrument}.json"
          report=json.loads(p.read_text(encoding="utf-8"))
          quality=json.loads((pathlib.Path("data/results")/f"quality_{instrument}.json").read_text(encoding="utf-8"))
          clusters=json.loads((pathlib.Path("data/results")/f"clusters_{instrument}.json").read_text(encoding="utf-8"))
          assert quality["sourceSha256"] == report["sourceSha256"]
          assert clusters["originalSourceSha256"] == report["sourceSha256"]
          assert clusters["originalPublicPrints"] == report["inputPrints"]
          assert clusters["originalTotalLots"] == clusters["derivedTotalLots"]
          assert clusters["derivedObservableClusters"] <= clusters["originalPublicPrints"]
          assert not clusters["actualParentOrdersIdentified"]
          assert not clusters["physicalBotCountKnown"]
          assert not clusters["statisticalSignificanceEstablished"]
          assert quality["sourcePrints"] == report["inputPrints"]
          assert quality["sourceGroups"] == report["sourceGroups"]
          assert not quality["ownerCountKnown"]
          assert not quality["sourceTimestampPrecisionVerified"]
          assert report["inputPrints"] > 0
          assert sum(g["publicPrintCount"] for g in report["groups"]) == report["inputPrints"]
          assert report["firstMilliseconds"]==100 and report["nullTrials"]==99
          assert not report["ownerCountKnown"] and not report["statisticalSignificanceEstablished"]
          groups=[]
          for g in report["groups"]:
              assert sum(g["phaseHistogram100Ms"])==g["publicPrintCount"]
              assert not g["feedCoverageVerified"]
              peak=g["maximumBinControl"]
              assert peak["observedPeakBinCount"]==max(g["phaseHistogram100Ms"])
              assert peak["observedPeakBinShare"]==peak["observedPeakBinCount"]/g["publicPrintCount"]
              if g["eligibleForControls"]:
                  assert len(g["rotatedControlCounts"])==99
                  assert len(peak["rotatedMaximumBinCounts"])==99
                  assert all(mx>=base for mx,base in
                             zip(peak["rotatedMaximumBinCounts"],g["rotatedControlCounts"]))
              else:
                  assert g["nullMeanFirstPhaseShare"] is None
                  assert g["descriptiveGlobalTailFrequency"] is None
              groups.append({
                  "tradeSource":g["tradeSource"],
                  "tradingMode":g["tradingMode"],
                  "sessionId":g["sessionId"],
                  "prints":g["publicPrintCount"],
                  "minuteBlocks":g["utcMinuteBlocks"],
                  "histogram100ms":g["phaseHistogram100Ms"],
                  "first100msShare":g["observedFirstPhaseShare"],
                  "eligible":g["eligibleForControls"],
                  "rotationMeanShare":g["nullMeanFirstPhaseShare"],
                  "rotation95Share":g["null95FirstPhaseShare"],
                  "descriptiveTailFrequency":g["descriptiveGlobalTailFrequency"],
                  "peak100msBin":peak["peak100MsBin"],
                  "peak100msShare":peak["observedPeakBinShare"],
                  "rotatedMaximumBinMeanShare":peak["nullMeanMaximumBinShare"],
                  "rotatedMaximumBin95Share":peak["null95MaximumBinShare"],
                  "descriptiveAnyBinTailFrequency":peak["descriptiveAnyBinTailFrequency"]
              })
          print("CLOCK_CROSS_INSTRUMENT_OBSERVED",json.dumps({
              "instrument":instrument,"day":"2026-11-18",
              "sourceSha256":report["sourceSha256"],
              "inputPrints":report["inputPrints"],
              "eligibleGroups":report["eligibleSourceGroups"],
              "ineligibleGroups":report["ineligibleSourceGroups"],
              "groups":groups,"actualOwnerCountKnown":False,
              "statisticalSignificanceEstablished":False
          },ensure_ascii=False))
          print("TIMESTAMP_QUALITY_OBSERVED",json.dumps({
            "instrument":instrument, "date":"2026-11-18",
            "sourceSha256":quality["sourceSha256"],
            "totalPrints":quality["sourcePrints"],
            "sourceGroups":[{
              "tradeSource":g["tradeSource"],
              "tradingMode":g["tradingMode"],
              "sessionId":g["sessionId"],
              "publicPrints":g["publicPrintCount"],
              "uniqueTimestamps":g["uniqueTimestampCount"],
              "timestampCollisionGroups":g["sameTimestampClusters"],
              "printsInCollisionGroups":g["printsInSameTimestampClusters"],
              "largestTimestampCluster":g["maxPrintsAtSameTimestamp"],
              "printsSharingTimestampAndPrice":g["printsInSameTimestampAndPriceClusters"],
              "wholeMillisecondPrints":g["wholeMillisecondTimestampPrints"],
              "subMillisecondPrints":g["subMillisecondTimestampPrints"],
              "nonMicrosecondAlignedPrints":g["notMicrosecondAlignedPrints"],
              "smallestPositiveGapMicroseconds":g["smallestPositiveGapMicroseconds"],
              "sourceTimestampPrecisionVerified":False
            } for g in quality["groups"]]
          },ensure_ascii=False))
          print("OBSERVABLE_CLUSTER_COMPARISON",json.dumps({
            "instrument":instrument,"date":"2026-11-18",
            "sourceSha256":clusters["originalSourceSha256"],
            "rawPrints":clusters["originalPublicPrints"],
            "derivedClusters":clusters["derivedObservableClusters"],
            "printsInsideMultiPrintClusters":clusters["publicPrintsInMultiPrintClusters"],
            "rawFixedSizeCadenceCandidates":clusters["originalFixedSizeCandidateEpisodes"],
            "derivedViewCadenceCandidates":clusters["derivedClusterSizeCandidateEpisodes"],
            "originalLots":clusters["originalTotalLots"],
            "derivedLots":clusters["derivedTotalLots"],
            "actualParentOrdersIdentified":False,
            "physicalBotCountKnown":False,
            "statisticalSignificanceEstablished":False
          },ensure_ascii=False))
          PY
          done
          echo "CLOCK_CROSS_INSTRUMENT_PILOT_COMPLETE: common clock patterns not robot identities"
      - name: Delete raw market data and temporary certificate
        if: always()
        shell: bash
        run: |
          rm -rf data/raw data/results
          rm -f /tmp/russian_trusted_root_ca.crt /tmp/clock-fetch.log
