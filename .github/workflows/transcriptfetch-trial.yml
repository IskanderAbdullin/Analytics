name: TranscriptFetch documented trial integration test
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/transcriptfetch-trial/**', '.github/workflows/transcriptfetch-trial.yml']
permissions:
  contents: read
  statuses: write
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Bounded trial of two public videos
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/transcriptfetch-trial/probe.py | tee "$RUNNER_TEMP/trial.log"
      - name: Report verified count
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -c '"status": "archived_verified"' "$RUNNER_TEMP/trial.log" || true)
          state=failure
          if [ "$count" -gt 0 ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=transcriptfetch-trial -f description="Verified archives: $count" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
