name: Serverspace full code-and-exports deploy
on:
  push:
    branches: [main]
    paths:
      - 'projects/cloudflare-control/serverspace_rebuild.py'
      - '.github/workflows/serverspace-full-deploy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cf-serverspace-full-export
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore existing code-only utility
        run: |
          gzip -dc projects/cloudflare-control/serverspace_deploy.py.gz > "$RUNNER_TEMP/serverspace_deploy.py"
          cp projects/cloudflare-control/serverspace_rebuild.py "$RUNNER_TEMP/serverspace_rebuild.py"
          python -m py_compile "$RUNNER_TEMP/serverspace_deploy.py" "$RUNNER_TEMP/serverspace_rebuild.py"
      - name: Publish declared private entrypoint and activate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python "$RUNNER_TEMP/serverspace_rebuild.py"
