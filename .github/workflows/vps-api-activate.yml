name: Enable private Serverspace read-only Cloudflare API
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-api-activate.yml'
      - 'projects/vps-api-control/enable_inventory.py'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source
        run: python -m py_compile projects/vps-api-control/enable_inventory.py
      - name: Activate only the private read-only flag
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/vps-api-control/enable_inventory.py
      - name: Publish sanitized Actions status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = "success" ]; then state=success; desc="Private Serverspace flag activation confirmed";
          else state=failure; desc="Private Serverspace flag activation blocked"; fi
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="vps-serverspace-readonly-activation" \
            -f description="$desc" \
            -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" >/dev/null
