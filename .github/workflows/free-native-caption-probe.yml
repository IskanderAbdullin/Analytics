name: Free native caption API integration test
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/free-native-caption-probe/**', '.github/workflows/free-native-caption-probe.yml']
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test three documented anonymous API calls and private KV
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/free-native-caption-probe/probe.py | tee "$RUNNER_TEMP/native.log"
      - name: Report metadata only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -c '"status": "archived_verified"' "$RUNNER_TEMP/native.log" || true)
          state=failure
          if [ "$count" -gt 0 ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=free-native-caption-probe -f description="Verified archives: $count" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
