name: VPS Serverspace private inventory summary
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-api-summary.yml'
      - 'projects/vps-api-control/summary_probe.py'
      - 'projects/vps-api-control/summary_request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: serverspace-summary-existing-worker
  cancel-in-progress: false
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate aggregate-only worker code without deployment
        run: |
          python -m py_compile projects/vps-api-control/summary_probe.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"projects/vps-api-control")
          from summary_probe import JS
          Path("/tmp/ss-summary.mjs").write_text(JS)
          PY
          node --check /tmp/ss-summary.mjs
      - name: Stage aggregate-only Cron or read its result
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/vps-api-control/summary_probe.py
