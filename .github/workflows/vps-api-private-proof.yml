name: VPS API private Serverspace proof
on:
  push:
    branches: [main]
    paths:
      - 'projects/vps-api-control/canary.py'
      - 'projects/vps-api-control/enable_inventory.py'
      - '.github/workflows/vps-api-private-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: vps-api-private-proof-1123
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and check isolated implementation
        run: |
          gzip -dc projects/cloudflare-control/serverspace_deploy.py.gz > "$RUNNER_TEMP/serverspace_deploy.py"
          PYTHONPATH="$RUNNER_TEMP" python -m py_compile projects/vps-api-control/canary.py projects/vps-api-control/enable_inventory.py "$RUNNER_TEMP/serverspace_deploy.py"
      - name: Activate existing read-only Serverspace API flag
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: PYTHONPATH="$RUNNER_TEMP" python -u projects/vps-api-control/enable_inventory.py
      - name: Probe private Cloudflare Service binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/vps-api-control/canary.py
      - name: Link result status to exact public-safe job
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = "success" ]; then
            state=success
            desc="Private Serverspace API proof succeeded"
          else
            state=failure
            desc="Private Serverspace proof incomplete; inspect sanitized Actions log"
          fi
          gh api --method POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" -f context="vps-private-serverspace-proof" \
            -f description="$desc" \
            -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" >/dev/null
