name: VPS API private Serverspace proof
on:
  push:
    branches: [main]
    paths:
      - 'projects/vps-api-control/**'
      - '.github/workflows/vps-api-private-proof.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-api-private-proof-1123
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and check isolated implementation
        run: python -m py_compile projects/vps-api-control/canary.py
      - name: Probe private Cloudflare Service binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/vps-api-control/canary.py
