name: VPS private read-only power plan real provider proof
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-provider-plan-proof.yml'
      - 'projects/vps-api-control/power_plan_probe.py'
      - 'projects/vps-api-control/power_plan_probe_request.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vps-existing-private-plan-diagnostic-worker
  cancel-in-progress: false
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python and Cloudflare module syntax
        run: |
          python -m py_compile projects/vps-api-control/power_plan_probe.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"projects/vps-api-control")
          from power_plan_probe import JS
          Path("/tmp/private-plan-probe.mjs").write_text(JS)
          PY
          node --check /tmp/private-plan-probe.mjs
      - name: Schedule private read-only Cloudflare canary or read its result
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u projects/vps-api-control/power_plan_probe.py
