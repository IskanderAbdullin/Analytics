name: Cloudflare bounded native caption collector test
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/cf-native-batch/**', '.github/workflows/cf-native-batch.yml']
permissions:
  contents: read
  statuses: write
jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deploy and test a fixed Cloudflare batch within free API cap
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/cf-native-batch/run.py | tee "$RUNNER_TEMP/batch.log"
      - name: Publish receipt count
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(grep -c '"status": "archived_verified"' "$RUNNER_TEMP/batch.log" || true)
          state=failure
          if [ "$count" -gt 0 ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=cf-native-batch -f description="New verified transcripts: $count" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
