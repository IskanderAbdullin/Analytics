name: Official podcast ASR sample test
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/podcast-asr-probe/**', '.github/workflows/podcast-asr-probe.yml']
permissions:
  contents: read
  statuses: write
jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install speech recognizer
        run: python -m pip install --quiet faster-whisper
      - name: Check a bounded public podcast sample
        run: python projects/podcast-asr-probe/sample.py | tee "$RUNNER_TEMP/asr.log"
      - name: Publish probe status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          description=$(grep 'ASR_PROBE ' "$RUNNER_TEMP/asr.log" | tail -1 | cut -c1-130 || true)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=podcast-asr-probe -f description="${description:-ASR probe did not complete}" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
