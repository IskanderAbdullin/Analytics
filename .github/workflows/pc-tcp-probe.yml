name: Temporary PC TCP 22 probe
on:
  push:
    branches: [chatgpt/cloudflare-control-20261123]
    paths:
      - '.github/workflows/pc-tcp-probe.yml'
      - 'projects/cloudflare-control/pc_tcp_probe.py'
      - 'projects/cloudflare-control/pc_tcp_probe.mjs'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: temporary-pc-tcp-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax checks
        run: |
          python -m py_compile projects/cloudflare-control/pc_tcp_probe.py
          node --check projects/cloudflare-control/pc_tcp_probe.mjs
      - name: Temporary fixed port test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PC_SSH_PROBE_HOST: ${{ secrets.PC_SSH_PROBE_HOST }}
        run: python projects/cloudflare-control/pc_tcp_probe.py
