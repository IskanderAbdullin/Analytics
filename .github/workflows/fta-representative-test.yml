name: Native collector representative integration test
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/fta-collector/representative.jsonl','.github/workflows/fta-representative-test.yml']
permissions:
  contents: read
  statuses: write
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test the new collector on twelve representative episodes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/fta-collector/fta_collector.py projects/fta-collector/representative.jsonl "$RUNNER_TEMP/ledger.jsonl" --limit 12 --reserved-attempts 5 --execute
      - name: Report receipt ledger only
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ["RUNNER_TEMP"])/"ledger.jsonl"
          if p.exists():
           for line in p.read_text().splitlines():
            print("FTA_LEDGER "+json.dumps(json.loads(line)))
          PY
          count=$(grep -c '"status":"archived_verified"' "$RUNNER_TEMP/ledger.jsonl" || true)
          state=failure
          if [ "$count" -gt 0 ]; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=fta-representative-test -f description="Verified archive receipts: $count" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
