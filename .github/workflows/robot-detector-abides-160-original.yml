name: Robot Detector preregistered original genuine ABIDES 160-case study
# Original seeds 3301-3340, 4 cohorts, fixed thresholds. Aggregate only.
# One push-triggered original run; switch manual-only after success.
# Original frozen 160-source jobs #44944144915 and #44944168231 passed.
# Their original 217888-byte source JSONs have identical SHA256.
# Replay is not an independent 320-case source sample.
# Manual-only to prevent unnecessary matching-engine reruns.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-synthetic-160-source-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: projects/robot-detector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze 40 local seeds, original cohort rules and 160-case negatives
        run: |
          set -euo pipefail
          python tools/research_seed_registry.py
          python -m unittest discover -s tests_background -p 'test_abides_grid_replication_160.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_clustered_grid_holdout.py' -v
          python -m unittest discover -s tests_background -p 'test_abides_matched_smalln_audit.py' -v
          python -m unittest discover -s tests_background -p 'test_autonomy_checkpoint.py' -v
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from abides_grid_replication_160 import SEEDS,COHORTS,frozen_protocol,check_ledger
          p=frozen_protocol()
          check_ledger()
          assert len(SEEDS)==40 and SEEDS[0]==3301 and SEEDS[-1]==3340
          assert len(COHORTS)==4 and p['planned_engine_cases']==160
          assert p['source_status_at_design']=='NOT_RUN'
          assert p['source_engine_revision']=='ac7a2a7bf6e406cd2bbed887e22c5a5a790bb242'
          assert p['no_real_market_FDR_or_owner_accuracy_claim']
          assert p['no_raw_trades_L2_rows_private_agent_or_order_ids_in_artifact']
          PY
      - name: Install pinned genuine ABIDES-NG matching engine revision
        run: |
          set -euo pipefail
          git clone --no-tags --filter=blob:none https://github.com/GabrieleDiCorato/abides-ng.git /tmp/abides-ng
          git -C /tmp/abides-ng checkout --detach ac7a2a7bf6e406cd2bbed887e22c5a5a790bb242
          python -m pip install --disable-pip-version-check -e /tmp/abides-ng/abides-core -e /tmp/abides-ng/abides-markets
      - name: Run all original 160 source cases without selecting outcomes
        run: |
          set -euo pipefail
          python tools/abides_grid_replication_160.py \
            --output /tmp/abides-original-160-source-only.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/abides-original-160-source-only.json').read_text())
          assert r['schema_version']=='genuine-abides-public-clock-160source-replication-original-v1'
          assert r['original_matching_engine_source_case_count']==160
          assert len(r['local_new_source_seeds_not_certified_globally_blind'])==40
          assert len(r['all_original_160_anonymous_case_aggregates'])==160
          assert set(r['source_cohorts'])=={
            'poisson_noise_null','fixed_20s_noise_hard_negative',
            'momentum_noise_hard_negative','twap_45s_positive'
          }
          assert all(x['independent_local_seed_engine_runs']==40
                     for x in r['source_cohorts'].values())
          assert not r['frozen_thresholds_and_grid_phases_modified_after_inspection']
          assert not r['original_source_cases_or_false_alarms_omitted']
          assert not r['physical_owner_or_real_market_FDR_calibrated']
          assert not r['raw_source_trades_L2_books_private_agent_IDs_exported']
          for x in r['all_original_160_anonymous_case_aggregates']:
              assert x['public_prints']>=1 and x['public_L2_snapshot_events']>=1
              assert x['public_prints']-x['unique_execution_timestamps']==x['same_timestamp_extra_prints']
              assert x['per_print_decision'] in ('ABSTAIN','TARGET_PATTERN','NO_TARGET_PATTERN')
              assert x['per_unique_decision'] in ('ABSTAIN','TARGET_PATTERN','NO_TARGET_PATTERN')
              assert not x['actual_market_owner_identity_or_FDR_known']
              assert not x['raw_prints_or_L2_snapshots_exported']
              if x['source_cohort']=='twap_45s_positive':
                  assert x['synthetic_target_present_posthoc']
                  assert x['posthoc_controlled_TWAP_fills']>=0
              else:
                  assert not x['synthetic_target_present_posthoc']
                  assert x['posthoc_controlled_TWAP_fills']==0
          print('ORIGINAL_ABIDES_160_VALIDATED',json.dumps({
            'matched_source_runs':160,
            'cohorts':r['source_cohorts'],
            'real_market_fdr_calibrated':False
          },sort_keys=True))
          PY
      - name: Keep small synthetic-source aggregates for seven days only
        uses: actions/upload-artifact@v4
        with:
          name: robot-detector-abides-original-160-anonymous
          path: /tmp/abides-original-160-source-only.json
          retention-days: 7
          if-no-files-found: error
