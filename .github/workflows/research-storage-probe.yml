name: Private research storage capability test
on:
  push:
    branches: [chatgpt/youtube-transcript-probe-20261125]
    paths: ['projects/research-storage-probe/**', '.github/workflows/research-storage-probe.yml']
permissions:
  contents: read
  statuses: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test dedicated R2 standard bucket and synthetic fixture
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -o pipefail
          python projects/research-storage-probe/r2_probe.py | tee "$RUNNER_TEMP/r2.log"
      - name: Publish metadata-only status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          description=$(grep 'R2_RESULT read' "$RUNNER_TEMP/r2.log" | tail -1 | cut -c1-130 || true)
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=research-storage-probe -f description="${description:-R2 probe not verified; see log}" -f target_url="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
