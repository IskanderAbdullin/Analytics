# This is a standalone forensic research utility, not the IPOAnalytics package.
# Long CSV/report-format lines and preserved import grouping are consciously
# allowed; all correctness-focused F, B and UP checks remain enabled.
target-version = "py311"
line-length = 100

[lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "I001"]
